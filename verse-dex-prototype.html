<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VERSEDEX // Ship Registry</title>
<meta name="description" content="A live, searchable reference of every Star Citizen ship and vehicle — specs, loadouts, pledge prices, and a personal hangar tracker.">
<meta property="og:title" content="VERSEDEX — Star Citizen Ship Registry">
<meta property="og:description" content="A live, searchable reference of every Star Citizen ship and vehicle — specs, loadouts, pledge prices, and a personal hangar tracker.">
<meta property="og:type" content="website">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Crect width='24' height='24' fill='%230a0e13'/%3E%3Crect x='7' y='7' width='10' height='10' fill='%234fd8e8'/%3E%3C/svg%3E">
<meta name="theme-color" content="#0a0e13">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="VERSEDEX">
<link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 180 180'%3E%3Crect width='180' height='180' fill='%230a0e13'/%3E%3Cellipse cx='90' cy='90' rx='62' ry='23' fill='none' stroke='%234fd8e8' stroke-width='5'/%3E%3Cellipse cx='90' cy='90' rx='62' ry='23' fill='none' stroke='%234fd8e8' stroke-width='5' opacity='0.5' transform='rotate(-58 90 90)'/%3E%3Ccircle cx='90' cy='90' r='25' fill='%230a0e13' stroke='%234fd8e8' stroke-width='4'/%3E%3Ccircle cx='152' cy='90' r='6' fill='%23f0a840'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;600;700&family=Share+Tech+Mono&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0a0e13; --panel:#111820; --panel-2:#161f29; --line:#22303c;
    --cyan:#4fd8e8; --amber:#f0a840; --text:#e6edf2; --muted:#728192; --red:#e85a5a;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;background:var(--bg);color:var(--text);font-family:'Inter',sans-serif;}
  body{
    background-image:
      radial-gradient(circle at 15% 8%, rgba(79,216,232,0.06), transparent 40%),
      radial-gradient(circle at 85% 90%, rgba(240,168,64,0.05), transparent 45%);
    min-height:100vh; padding-bottom:40px;
  }
  @media (prefers-reduced-motion: reduce){ *{animation:none !important; transition:none !important;} }

  header{
    position:sticky; top:0; z-index:20; background:rgba(10,14,19,0.92); backdrop-filter:blur(6px);
    border-bottom:1px solid var(--line); padding:14px 16px 10px;
    max-height:100vh; overflow-y:auto; -webkit-overflow-scrolling:touch;
    overscroll-behavior:contain;
  }
  .brand{display:flex; align-items:baseline; gap:8px;}
  .brand .mark{width:9px;height:9px;background:var(--cyan);box-shadow:0 0 8px var(--cyan); flex-shrink:0;}
  .brand h1{font-family:'Rajdhani',sans-serif; font-weight:700; letter-spacing:2px; font-size:18px; margin:0; text-transform:uppercase;}
  .brand h1 span{color:var(--cyan);}
  .brand .count{margin-left:auto; font-family:'Share Tech Mono',monospace; font-size:11px; color:var(--muted);}
  .sub{font-family:'Share Tech Mono',monospace; font-size:10px; color:var(--muted); letter-spacing:1px;}

  .header-actions{display:flex; gap:8px; margin-top:10px;}
  .toolbar{display:flex; gap:6px; margin-top:10px;}

  /* ---- Top navigation ---- */
  #top-nav{
    display:flex; gap:0; margin-top:10px;
    border-top:1px solid var(--line); border-bottom:1px solid var(--line);
  }
  .nav-item{
    flex:1; position:relative; background:none; border:none; cursor:pointer;
    display:flex; flex-direction:column; align-items:center; gap:3px;
    padding:8px 4px 7px; color:var(--muted);
    font-family:'Share Tech Mono',monospace; font-size:9px; letter-spacing:0.8px;
  }
  .nav-item svg{width:19px; height:19px;}
  .nav-item.active{color:var(--cyan);}
  .nav-item.active::after{
    content:''; position:absolute; bottom:-1px; left:20%; right:20%; height:2px; background:var(--cyan);
  }
  .nav-badge{
    position:absolute; top:3px; right:50%; transform:translateX(19px);
    background:var(--amber); color:var(--bg); font-size:8.5px; font-weight:700;
    min-width:15px; padding:1px 4px; border-radius:7px; line-height:1.4;
  }
  .nav-badge.empty{display:none;}
  .nav-dot{
    position:absolute; top:6px; right:50%; transform:translateX(16px);
    width:6px; height:6px; border-radius:50%; background:var(--amber);
  }
  .nav-dot.seen{display:none;}

  /* Keep clear of the Netlify badge in the bottom-right corner */
  body{padding-bottom:64px;}
  #detail, #compare-view, #tools-view{padding-bottom:64px;}
  #compare-bar{bottom:16px; right:96px;}
  .tb-btn{
    display:flex; align-items:center; justify-content:center; gap:6px;
    background:var(--panel); border:1px solid var(--line); color:var(--text);
    font-family:'Share Tech Mono',monospace; font-size:10.5px; letter-spacing:0.5px;
    text-transform:uppercase; cursor:pointer; padding:9px 10px; flex:0 0 auto;
  }
  .tb-btn.tb-primary{flex:1 1 auto;}
  .tb-btn#hangar-toggle{flex:1 1 auto;}
  .tb-btn.active{background:var(--cyan); color:var(--bg); border-color:var(--cyan); font-weight:700;}
  .tb-badge{
    background:rgba(255,255,255,0.14); padding:1px 6px; font-size:9.5px; min-width:16px; text-align:center;
  }
  .tb-btn.active .tb-badge{background:rgba(10,14,19,0.25);}
  .tb-btn#adv-filter-toggle .tb-badge{background:var(--amber); color:var(--bg); font-weight:700;}
  .hangar-toggle-btn{
    flex:1; display:flex; align-items:center; justify-content:center; gap:8px;
    background:var(--panel); border:1px solid var(--line); color:var(--text); padding:9px 12px;
    font-family:'Share Tech Mono',monospace; font-size:11px; letter-spacing:1px; text-transform:uppercase; cursor:pointer;
  }
  .icon-btn{
    flex:0 0 46px; display:flex; align-items:center; justify-content:center;
    background:var(--panel); border:1px solid var(--line); color:var(--text); font-size:16px; cursor:pointer;
  }
  .icon-btn:active{background:var(--panel-2);}
  .hangar-toggle-btn.active{background:var(--cyan); color:var(--bg); border-color:var(--cyan); font-weight:700;}
  .hangar-toggle-btn svg{flex-shrink:0;}
  .hangar-count-badge{
    background:rgba(255,255,255,0.12); color:inherit; padding:1px 7px; font-size:10px; min-width:18px; text-align:center;
  }
  .hangar-toggle-btn.active .hangar-count-badge{background:rgba(10,14,19,0.25);}

  .searchbar{margin-top:12px; display:flex; align-items:center; gap:8px; background:var(--panel); border:1px solid var(--line); padding:9px 12px;}
  .searchbar input{flex:1; background:none; border:none; outline:none; color:var(--text); font-family:'Inter',sans-serif; font-size:14px;}
  .searchbar input::placeholder{color:var(--muted);}

  .filters{display:flex; gap:6px; margin-top:10px; overflow-x:auto; padding-bottom:2px; scrollbar-width:none;}
  .filters::-webkit-scrollbar{display:none;}
  .chip{flex-shrink:0; font-family:'Share Tech Mono',monospace; font-size:11px; letter-spacing:0.5px; color:var(--muted); border:1px solid var(--line); padding:6px 11px; cursor:pointer; text-transform:uppercase; white-space:nowrap; background:transparent;}
  .chip.active{color:var(--bg); background:var(--cyan); border-color:var(--cyan); font-weight:700;}

  .sort-row{display:flex; align-items:center; gap:8px; margin-top:10px;}
  .sort-row select{
    background:var(--panel); border:1px solid var(--line); color:var(--text); font-family:'Share Tech Mono',monospace;
    font-size:11px; padding:6px 8px; flex:1;
  }

  .range-filters{margin-top:10px; display:flex; flex-direction:column; gap:8px;}
  .range-filters label{font-family:'Share Tech Mono',monospace; font-size:10px; color:var(--muted); letter-spacing:0.5px; text-transform:uppercase; display:flex; flex-direction:column; gap:4px;}
  .range-filters label span{color:var(--cyan);}
  .range-filters input[type="range"]{width:100%; accent-color:var(--cyan); height:20px;}

  .adv-filter-panel{
    display:none; margin-top:8px; padding:12px; background:var(--panel); border:1px solid var(--line);
    flex-direction:column; gap:12px;
    max-height:65vh; overflow-y:auto; -webkit-overflow-scrolling:touch;
    overscroll-behavior:contain;  /* stops the page behind scrolling instead */
  }
  .adv-filter-panel.visible{display:flex;}
  .adv-panel-head{
    position:sticky; top:-12px; margin:-12px -12px 0; padding:10px 12px; z-index:2;
    background:var(--panel-2); border-bottom:1px solid var(--line);
    display:flex; justify-content:space-between; align-items:center;
    font-family:'Share Tech Mono',monospace; font-size:10px; letter-spacing:1px; color:var(--cyan);
  }
  .adv-close-btn{
    background:none; border:1px solid var(--line); color:var(--muted); cursor:pointer;
    font-family:'Share Tech Mono',monospace; font-size:10px; padding:4px 8px;
  }
  .adv-row{display:flex; flex-direction:column; gap:6px;}
  .adv-label{font-family:'Share Tech Mono',monospace; font-size:9px; color:var(--muted); letter-spacing:0.5px; text-transform:uppercase;}
  .adv-select{background:var(--panel-2); border:1px solid var(--line); color:var(--text); font-family:'Share Tech Mono',monospace; font-size:11px; padding:7px 8px;}
  .adv-checks{flex-direction:row; gap:16px; flex-wrap:wrap;}
  .adv-check{display:flex; align-items:center; gap:6px; font-family:'Inter',sans-serif; font-size:12px; color:var(--text);}
  .adv-check input{accent-color:var(--cyan); width:15px; height:15px;}

  .hangar-summary{margin:12px 16px 0; padding:12px; background:var(--panel-2); border:1px solid var(--line); display:none;}
  .hangar-summary.visible{display:block;}
  .hangar-summary .hs-row{display:flex; justify-content:space-between; align-items:center;}
  .hangar-summary .hs-value{font-family:'Rajdhani',sans-serif; font-size:20px; font-weight:700; color:var(--amber);}
  .hangar-summary .hs-label{font-family:'Share Tech Mono',monospace; font-size:10px; color:var(--muted); letter-spacing:0.5px; text-transform:uppercase;}
  .hangar-summary .hs-copy{
    margin-top:10px; width:100%; padding:8px; background:none; border:1px solid var(--cyan); color:var(--cyan);
    font-family:'Share Tech Mono',monospace; font-size:11px; letter-spacing:1px; text-transform:uppercase; cursor:pointer;
  }

  .similar-list{padding:0 16px; display:flex; flex-direction:column; gap:6px;}
  .similar-row{display:flex; align-items:center; gap:10px; background:var(--panel); border:1px solid var(--line); padding:8px 10px; cursor:pointer;}
  .similar-row:active{background:var(--panel-2);}
  .sim-thumb{width:38px;height:38px;flex-shrink:0; background:var(--panel-2); border:1px solid var(--line);
             overflow:hidden; display:flex;align-items:center;justify-content:center;
             font-family:'Rajdhani',sans-serif;font-weight:700;color:var(--muted);font-size:11px;}
  .sim-thumb img{width:100%;height:100%;object-fit:cover; display:block;}
  /* Safety net: nothing inside a data row may overflow it */
  .eff-row, .similar-row, .row{overflow:hidden;}
  .similar-row .sim-name{font-family:'Rajdhani',sans-serif; font-weight:700; font-size:13.5px;}
  .similar-row .sim-meta{font-size:10.5px; color:var(--muted); margin-top:1px;}

  #status-banner{margin:12px 16px 0; padding:9px 11px; font-size:11px; font-family:'Share Tech Mono',monospace; border:1px solid var(--line); display:none;}
  #status-banner.loading{display:block; color:var(--cyan); border-color:rgba(79,216,232,0.35); background:rgba(79,216,232,0.06);}
  #status-banner.error{display:block; color:var(--amber); border-color:rgba(240,168,64,0.35); background:rgba(240,168,64,0.06);}
  #status-banner.ok{display:block; color:#7ce89a; border-color:rgba(124,232,154,0.35); background:rgba(124,232,154,0.06);}

  #list{padding:14px 16px 4px; display:flex; flex-direction:column; gap:8px;}
  .row{display:flex; align-items:center; gap:12px; background:var(--panel); border:1px solid var(--line); padding:10px; cursor:pointer;}
  .row:active{background:var(--panel-2);}
  .row .thumb{width:52px;height:52px;flex-shrink:0; background:var(--panel-2); border:1px solid var(--line); overflow:hidden; display:flex;align-items:center;justify-content:center; font-family:'Rajdhani',sans-serif;font-weight:700;color:var(--muted);font-size:14px;}
  .row .thumb img{width:100%;height:100%;object-fit:cover;}
  .row .info{flex:1; min-width:0;}
  .row .name{font-family:'Rajdhani',sans-serif; font-weight:700; font-size:16px; line-height:1.1;}
  .row .manu{font-size:11px; color:var(--muted); margin-top:2px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
  .row .role{font-family:'Share Tech Mono',monospace; font-size:9px; color:var(--cyan); letter-spacing:1px; text-transform:uppercase; border:1px solid rgba(79,216,232,0.35); padding:2px 6px; flex-shrink:0; max-width:90px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
  .row .hangar-star{
    flex-shrink:0; width:30px; height:30px; display:flex; align-items:center; justify-content:center;
    background:none; border:1px solid var(--line); color:var(--muted); cursor:pointer; padding:0;
  }
  .row .hangar-star.in-hangar{color:var(--amber); border-color:rgba(240,168,64,0.5);}
  .row .compare-btn{
    flex-shrink:0; width:30px; height:30px; display:flex; align-items:center; justify-content:center;
    background:none; border:1px solid var(--line); color:var(--muted); cursor:pointer; padding:0; font-size:13px;
    font-family:'Share Tech Mono',monospace;
  }
  .row .compare-btn.selected{color:var(--bg); background:var(--cyan); border-color:var(--cyan); font-weight:700;}
  .empty-state{padding:40px 20px; text-align:center; color:var(--muted); font-family:'Share Tech Mono',monospace; font-size:12px; line-height:1.8;}

  #compare-bar{
    position:fixed; left:16px; right:16px; bottom:16px; z-index:52;
    background:var(--cyan); color:var(--bg); border:1px solid var(--cyan);
    display:none; align-items:center; justify-content:space-between; padding:12px 16px;
    font-family:'Share Tech Mono',monospace; font-weight:700; letter-spacing:1px; text-transform:uppercase;
    cursor:pointer; box-shadow:0 4px 20px rgba(0,0,0,0.4);
  }
  #compare-bar.visible{display:flex;}
  #compare-bar .cb-clear{
    font-size:11px; font-weight:500; color:var(--bg); opacity:0.75; background:none; border:none;
    text-decoration:underline; padding:4px; cursor:pointer; font-family:inherit;
  }

  #compare-view{position:fixed; inset:0; background:var(--bg); z-index:55; transform:translateY(100%); transition:transform 0.28s ease; overflow-y:auto;}
  #compare-view.open{transform:translateY(0);}
  .cmp-scroll{overflow-x:auto; -webkit-overflow-scrolling:touch;}
  .cmp-grid{display:grid; min-width:max-content;}
  .cmp-row{display:contents;}
  .cmp-cell{padding:10px 12px; border-bottom:1px solid var(--line); border-right:1px solid var(--line); font-size:12.5px; display:flex; align-items:center;}
  .cmp-cell.label{
    position:sticky; left:0; background:var(--bg); z-index:2; font-family:'Share Tech Mono',monospace;
    font-size:9px; color:var(--muted); letter-spacing:0.5px; text-transform:uppercase; width:96px;
  }
  .cmp-cell.shipcol{width:136px; flex-direction:column; align-items:stretch; gap:4px; font-family:'Rajdhani',sans-serif;}
  .cmp-thumb{width:100%; height:80px; background:var(--panel); border:1px solid var(--line); overflow:hidden; display:flex; align-items:center; justify-content:center; font-size:11px; color:var(--muted); font-family:'Rajdhani',sans-serif; font-weight:700;}
  .cmp-thumb img{width:100%;height:100%;object-fit:cover;}
  .cmp-shipname{font-weight:700; font-size:14px; line-height:1.15;}
  .cmp-remove{align-self:flex-start; font-family:'Share Tech Mono',monospace; font-size:9px; color:var(--muted); background:none; border:1px solid var(--line); padding:2px 6px; cursor:pointer; margin-top:2px;}
  .cmp-value{font-family:'Rajdhani',sans-serif; font-weight:600; font-size:13.5px;}

  #home-view{position:fixed; inset:0; background:var(--bg); z-index:47; overflow-y:auto; transform:translateY(100%); transition:transform 0.28s ease;}
  #home-view.open{transform:translateY(0);}
  .home-hero{padding:26px 20px 18px; text-align:center; border-bottom:1px solid var(--line);}
  .home-hero h2{font-family:'Rajdhani',sans-serif; font-size:26px; font-weight:700; margin:10px 0 6px; letter-spacing:1px;}
  .home-hero h2 span{color:var(--cyan);}
  .home-hero p{font-size:13px; color:var(--muted); line-height:1.6; margin:0; max-width:420px; margin-inline:auto;}
  .home-stat{display:flex; justify-content:center; gap:22px; margin-top:14px;}
  .home-stat div{text-align:center;}
  .home-stat .hs-n{font-family:'Rajdhani',sans-serif; font-weight:700; font-size:20px; color:var(--cyan);}
  .home-stat .hs-l{font-family:'Share Tech Mono',monospace; font-size:9px; color:var(--muted); letter-spacing:1px;}
  /* ---------- Animated tutorial ---------- */
  #tutorial{position:fixed; inset:0; z-index:80; background:rgba(5,8,11,0.9);
            display:none; align-items:center; justify-content:center; padding:20px;}
  #tutorial.open{display:flex;}
  .tut-card{width:100%; max-width:400px; background:var(--panel); border:1px solid var(--line);
            position:relative; overflow:hidden;}
  .tut-skip{position:absolute; top:10px; right:10px; z-index:3; background:none; border:none;
            color:var(--muted); font-family:'Share Tech Mono',monospace; font-size:10px;
            letter-spacing:1px; cursor:pointer; padding:6px 8px;}
  .tut-stage{height:190px; background:var(--void, #080c11); border-bottom:1px solid var(--line);
             position:relative; overflow:hidden;}
  .tut-text{padding:16px 18px 4px;}
  .tut-title{font-family:'Rajdhani',sans-serif; font-weight:700; font-size:19px; color:var(--text);}
  .tut-desc{font-size:13px; color:var(--muted); line-height:1.55; margin-top:5px; min-height:58px;}
  .tut-dots{display:flex; gap:6px; justify-content:center; padding:6px 0 12px;}
  .tut-dot{width:6px; height:6px; border-radius:50%; background:var(--line); transition:all .25s;}
  .tut-dot.on{background:var(--cyan); width:18px; border-radius:3px;}
  .tut-nav{display:flex; gap:8px; padding:0 16px 16px;}
  .tut-btn{flex:1; padding:11px; background:none; border:1px solid var(--line); color:var(--muted);
           font-family:'Share Tech Mono',monospace; font-size:11px; letter-spacing:1px; cursor:pointer;}
  .tut-btn.primary{background:var(--cyan); border-color:var(--cyan); color:var(--bg); font-weight:700;}
  .tut-btn:disabled{opacity:0.35; cursor:default;}

  /* animated mock elements inside the stage */
  .tm{position:absolute; opacity:0; animation-fill-mode:forwards;}
  @keyframes tmIn{from{opacity:0; transform:translateY(8px);} to{opacity:1; transform:none;}}
  @keyframes tmSlide{from{opacity:0; transform:translateX(-14px);} to{opacity:1; transform:none;}}
  @keyframes tmPop{0%{opacity:0; transform:scale(.8);} 60%{transform:scale(1.08);} 100%{opacity:1; transform:scale(1);}}
  @keyframes tmPulse{0%,100%{opacity:.35;} 50%{opacity:1;}}
  @keyframes tmTap{0%,70%{opacity:0; transform:scale(1.6);} 85%{opacity:.9; transform:scale(.9);} 100%{opacity:0; transform:scale(1.3);}}
  @keyframes tmBar{from{width:0;} to{width:var(--w,60%);}}
  .tm-row{left:14px; right:14px; height:30px; background:var(--panel); border:1px solid var(--line);
          display:flex; align-items:center; gap:8px; padding:0 8px;
          font-family:'Rajdhani',sans-serif; font-weight:700; font-size:12px; color:var(--text);}
  .tm-chip{height:20px; padding:0 8px; display:flex; align-items:center; background:transparent;
           border:1px solid var(--line); font-family:'Share Tech Mono',monospace; font-size:9px; color:var(--muted);}
  .tm-chip.on{background:var(--cyan); color:var(--bg); border-color:var(--cyan); font-weight:700;}
  .tm-tap{width:26px; height:26px; border-radius:50%; border:2px solid var(--cyan);
          animation:tmTap 1.8s ease-out infinite;}
  .tm-star{color:var(--amber); font-size:15px;}
  .tm-bar{height:7px; background:var(--cyan);}

  .install-card{
    display:flex; gap:13px; align-items:flex-start; margin:14px 16px 4px;
    background:linear-gradient(135deg, rgba(79,216,232,0.09), rgba(240,168,64,0.05));
    border:1px solid rgba(79,216,232,0.4); padding:14px;
  }
  .ic-icon{flex:0 0 40px; height:40px; display:flex; align-items:center; justify-content:center;
           border:1px solid rgba(79,216,232,0.4); color:var(--cyan);}
  .ic-icon svg{width:20px;height:20px;}
  .ic-body{flex:1; min-width:0;}
  .ic-title{font-family:'Rajdhani',sans-serif; font-weight:700; font-size:15.5px; color:var(--text);}
  .ic-desc{font-size:12px; color:var(--muted); line-height:1.5; margin-top:3px;}
  .ic-actions{display:flex; gap:8px; margin-top:10px;}
  .ic-btn{
    font-family:'Share Tech Mono',monospace; font-size:10.5px; letter-spacing:0.8px; padding:7px 12px;
    background:none; border:1px solid var(--line); color:var(--muted); cursor:pointer;
  }

  .hero-frame .fallback{font-family:'Rajdhani',sans-serif; font-weight:700; color:var(--line); font-size:15px; text-align:center; padding:0 20px; letter-spacing:1px;}

  .title-block{padding:14px 16px 0;}

  .stat .v{font-family:'Rajdhani',sans-serif; font-size:19px; font-weight:700; margin-top:3px; color:var(--text);}
  .stat .v small{font-size:11px; color:var(--muted); font-weight:500;}
  .stat.wide{grid-column:1/-1;}

  .cta.primary{color:var(--bg); background:var(--cyan); border-color:var(--cyan); font-weight:700;}

  /* ================= DESKTOP / TABLET LAYOUT =================
     Mobile-first styles above are untouched; these only apply on wider
     viewports where a single stretched column reads badly. */
  @media (min-width: 760px){
    /* Constrain the overall reading width so content isn't spread thin */
    header > *, #list, #status-banner, #hangar-summary{
      max-width:900px; margin-left:auto; margin-right:auto;
    }
    header{padding-left:24px; padding-right:24px;}

    /* Ship rows: two per line, still tappable cards */
    #list{
      display:grid; grid-template-columns:1fr 1fr; gap:8px;
      max-width:900px; margin-inline:auto;
    }

    /* Hero image was filling the viewport before any data was visible */
    .hero{max-width:900px; margin-inline:auto; padding-top:16px;}
    .hero-frame{aspect-ratio:auto; height:300px;}
    .hero-frame img{object-fit:cover; object-position:center;}

    .title-block, .desc-text, .footnote{max-width:900px; margin-inline:auto;}

    /* Two-column flow for the stacked sections.
       break-inside stops a panel splitting across the column gap;
       break-after on labels keeps a heading with its content. */
    #d-body .detail-flow{
      max-width:900px; margin-inline:auto;
      column-count:2; column-gap:20px; padding:0 4px;
    }
    #d-body .detail-flow > *{break-inside:avoid; -webkit-column-break-inside:avoid;}
    #d-body .detail-flow .section-label{break-after:avoid; -webkit-column-break-after:avoid; margin-top:14px;}
    #d-body .detail-flow .stat-grid,
    #d-body .detail-flow .flight-panel,
    #d-body .detail-flow .hp-list,
    #d-body .detail-flow .price-panel,
    #d-body .detail-flow .rvb-panel,
    #d-body .detail-flow .uec-list,
    #d-body .detail-flow .similar-list,
    #d-body .detail-flow .weapon-list{margin-left:0; margin-right:0;}
    #d-body .detail-flow .cta-row{padding-left:0; padding-right:0;}

    /* Tools, manufacturer and compare views get the same reading width */
    #tools-body, .tool-intro, .tool-field, .tool-note,
    .eff-row, .mfg-row, .roi-result, .hangar-summary{
      max-width:900px; margin-inline:auto;
    }
    .cmp-scroll{max-width:900px; margin-inline:auto;}
    .tool-tabs{max-width:900px; margin-inline:auto;}

    /* Home page: feature cards side by side */
    .home-hero{max-width:900px; margin-inline:auto;}
    #home-body .feature-card, #home-body .install-card{max-width:900px; margin-inline:auto;}
  }

  @media (min-width: 1100px){
    header > *, #list, .hero, .title-block, .desc-text, .footnote,
    #d-body .detail-flow, #tools-body, .cmp-scroll, .tool-tabs,
    .home-hero, #home-body .feature-card, #home-body .install-card,
    #status-banner, #hangar-summary{max-width:1040px;}
    #list{grid-template-columns:repeat(3, 1fr);}
    .hero-frame{height:340px;}
    /* Feature cards in a grid rather than a long single column */
    #home-body{display:block;}
  }

  /* Pointer devices: give rows a hover state */
  @media (hover: hover){
    .row:hover, .eff-row:hover, .mfg-row:hover, .similar-row:hover,

    .chip:hover{color:var(--text);}
  }

  .footnote{padding:8px 16px 24px; font-size:10.5px; color:#4a5765; font-family:'Share Tech Mono',monospace; line-height:1.6;}
  .desc-text{padding:0 16px; font-size:12.5px; color:var(--muted); line-height:1.6;}
</style>

const HANGAR_KEY = "versedex_hangar_v1";

let savedHangarNames = [];

function loadHangar(){
  try{
    const raw = localStorage.getItem(HANGAR_KEY);
    if(!raw){ hangarIds = new Set(); }
    else{
      const parsed = JSON.parse(raw);
      if(Array.isArray(parsed)){
        // v1 format: a bare array of IDs
        hangarIds = new Set(parsed);
        savedHangarNames = [];
      }else{
        hangarIds = new Set(parsed.ids || []);
        savedHangarNames = parsed.names || [];
      }
    }
  }catch(err){
    hangarAvailable = false;
    hangarIds = new Set();
    console.warn("Hangar storage unavailable:", err.message);
  }
  updateHangarCount();
}

/* After the roster loads, recover any hangar entries whose IDs no longer
   exist (e.g. the API reissued UUIDs) by matching on saved ship names. */
function reconcileHangar(){
  if(!SHIPS.length) return;
  const validIds = new Set(SHIPS.map(s=>s.id));
  const orphaned = [...hangarIds].filter(id => !validIds.has(id));
  if(orphaned.length === 0) return;

  let recovered = 0;
  orphaned.forEach(id => hangarIds.delete(id));
  savedHangarNames.forEach(name=>{
    const match = SHIPS.find(s=>s.name === name);
    if(match && !hangarIds.has(match.id)){ hangarIds.add(match.id); recovered++; }
  });

  if(recovered > 0){
    saveHangar();
    setStatus(`HANGAR RESTORED — ${recovered} ship${recovered===1?'':'s'} rematched after a data update`, "ok");
    setTimeout(()=>{ const el=document.getElementById('status-banner'); if(el) el.style.display='none'; }, 4000);
  }
  updateHangarCount();
}

function saveHangar(){
  if(!hangarAvailable) return;
  try{
    // Store names as well as IDs. The wiki API can regenerate UUIDs when the
    // game data version changes, which would otherwise silently empty the
    // hangar; names let us recover the selection.
    const names = [...hangarIds]
      .map(id => { const sh = SHIPS.find(x=>x.id===id); return sh ? sh.name : null; })
      .filter(Boolean);
    localStorage.setItem(HANGAR_KEY, JSON.stringify({ v:2, ids:[...hangarIds], names }));
  }catch(err){
    hangarAvailable = false;
    setStatus("HANGAR STORAGE UNAVAILABLE — this browser is blocking local storage.", "error");
  }
}

function toggleHangar(id){
  if(hangarIds.has(id)) hangarIds.delete(id); else hangarIds.add(id);
  saveHangar();
  updateHangarCount();
  renderList();
}

function updateHangarCount(){
  document.getElementById('hangar-toggle-count').textContent = hangarIds.size;
  if(typeof updateNavBadges === 'function') updateNavBadges();
}

    if(compareIds.size >= MAX_COMPARE){
      setStatus(`YOU CAN COMPARE UP TO ${MAX_COMPARE} SHIPS — remove one first`, "error");
      setTimeout(()=>{ document.getElementById('status-banner').style.display='none'; }, 2500);
      return;
    }
    compareIds.add(id);
  }
  updateCompareBar();
  renderList();
}

  compareIds.clear();
  updateCompareBar();
  renderList();
  closeCompareView();
}

async function copyHangarList(owned, total){
  const lines = [
    `MY STAR CITIZEN HANGAR (${owned.length} ships)`,
    ...owned.map(s => `- ${s.name} (${s.manufacturer})${s.priceUSD != null ? ' — ' + formatPrice(s) : ''}`),
    `Total fleet value: ${formatTotal(total)}`
  ];
  const text = lines.join('\n');
  try{
    await navigator.clipboard.writeText(text);
    setStatus("HANGAR LIST COPIED TO CLIPBOARD", "ok");
  }catch(err){
    // Fallback for browsers without Clipboard API permission
    try{
      const ta = document.createElement('textarea');
      ta.value = text; ta.style.position = 'fixed'; ta.style.opacity = '0';
      document.body.appendChild(ta); ta.select();
      document.execCommand('copy');
      document.body.removeChild(ta);
      setStatus("HANGAR LIST COPIED TO CLIPBOARD", "ok");
    }catch(err2){
      setStatus("COULD NOT COPY — clipboard access blocked by browser", "error");
    }
  }
  setTimeout(()=>{ document.getElementById('status-banner').style.display='none'; }, 2500);
}

function fmt(n){ if(n===null||n===undefined) return "—"; return Number(n).toLocaleString(); }

/* Escape any value coming from an external API before it reaches innerHTML.
   The wiki and UEX feeds are community-editable, so treat them as untrusted. */
function esc(v){
  if(v === null || v === undefined) return '';
  return String(v).replace(/[&<>"']/g, c => ({
    '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
  }[c]));
}
function setStatus(msg, cls){
  const el = document.getElementById('status-banner');
  el.textContent = msg; el.className = cls;
}

/* ---------- Extract lightweight hardpoint/component size summary from ports data ---------- */
function extractPortSummary(v){
  const hardpointSizes = new Set();
  const componentSizesByType = {};
  const portGroups = {};   // { type: { size: count } }
  if(Array.isArray(v.ports)){
    v.ports.forEach(p=>{
      const size = p.sizes && p.sizes.max;
      if(size){
        hardpointSizes.add(size);
        const t = p.type;
        if(t){
          if(!componentSizesByType[t]) componentSizesByType[t] = new Set();
          componentSizesByType[t].add(size);
          if(!portGroups[t]) portGroups[t] = {};
          portGroups[t][size] = (portGroups[t][size] || 0) + 1;
        }
      }
    });
  }
  return {
    hardpointSizes: [...hardpointSizes].sort((a,b)=>a-b),
    componentSizesByType: Object.fromEntries(
      Object.entries(componentSizesByType).map(([k,set])=>[k, [...set].sort((a,b)=>a-b)])
    ),
    portGroups: portGroups
  };
}

/* ---------- Map raw API vehicle record -> our ship shape ---------- */
function mapVehicle(v){
  const foci = (v.foci && v.foci[0] && v.foci[0].en_EN) || (v.type && v.type.en_EN) || v.classification || "Uncategorized";

  // ---- Flight performance (agility, acceleration, boost) ----
  const ag = v.agility || {};
  const sp = v.speed || {};
  let mainG = null, retroG = null, mavG = null;
  if(v.propulsion && Array.isArray(v.propulsion.thrusters)){
    v.propulsion.thrusters.forEach(t=>{
      if(t.type === 'Main') mainG = t.g;
      else if(t.type === 'Retro') retroG = t.g;
      else if(t.type === 'Maneuver') mavG = t.g;
    });
  }

  // Snub craft detection: small parasite fighters carried by larger ships.
  // No dedicated API flag, so match on role/career/name text.
  const snubHaystack = [
    String(foci),
    (v.career || ''),
    (v.role || ''),
    (v.name || '')
  ].join(' ').toLowerCase();
  const isSnub = /\bsnub\b/.test(snubHaystack);

  // Ground vehicle detection. The API doesn't expose a single reliable boolean,
  // so check the fields that do appear, then fall back to role keywords.
  const typeStr = ((v.type && v.type.en_EN) || v.classification || '').toLowerCase();
  const fociStr = String(foci).toLowerCase();
  const isGroundVehicle =
    v.is_ground_vehicle === true ||
    v.is_spaceship === false ||
    typeStr.includes('ground') || typeStr.includes('vehicle') ||
    /\b(ground|rover|tank|buggy|bike|tracked|wheeled)\b/.test(fociStr);
  const status = (v.production_status && v.production_status.en_EN) ? v.production_status.en_EN.toLowerCase().replace(/\s+/g,'-') : "unknown";
  const img = (v.images && v.images[0]) ? (v.images[0].original_url || v.images[0].thumbnail_url) : null;
  const thumb = (v.images && v.images[0]) ? (v.images[0].thumbnail_url || v.images[0].original_url) : null;

  let weapons = [];
  if(v.weaponry && v.weaponry.fixed_weapons && Array.isArray(v.weaponry.fixed_weapons.weapons)){
    const counts = {};
    v.weaponry.fixed_weapons.weapons.forEach(w=>{ counts[w.name] = (counts[w.name]||0)+1; });
    weapons = Object.entries(counts).map(([name,count])=>`${count}x ${esc(name)}`);
  }
  if(v.weaponry && v.weaponry.missiles && v.weaponry.missiles.count){
    weapons.push(`${v.weaponry.missiles.count}x Missile${v.weaponry.missiles.count>1?'s':''}`);
  }

  // Price: prefer top-level msrp, else fall back to the pledge-store SKU listing.
  let priceUSD = null;
  if(typeof v.msrp === 'number' && v.msrp > 0){
    priceUSD = v.msrp;
  }else if(Array.isArray(v.skus)){
    const storeSku = v.skus.find(s => s.source === 'pledge_store' && typeof s.price === 'number' && s.price > 0)
                  || v.skus.find(s => typeof s.price === 'number' && s.price > 0);
    if(storeSku) priceUSD = storeSku.price;
  }

  // Pledge URL: prefer top-level, else fall back to any SKU that carries a store URL.
  let pledge = v.pledge_url || null;
  if(!pledge && Array.isArray(v.skus)){
    const withUrl = v.skus.find(s => s.url);
    if(withUrl) pledge = withUrl.url;
  }

  // Loaner ships. The API audit indicated loaners moved into the vehicle
  // record, but the exact key is unconfirmed - check the plausible ones and
  // accept either objects or plain strings.
  let loaners = [];
  const loanerSrc = v.loaners || v.loaner_vehicles || v.vehicle_loaners || v.loaner || null;
  if(Array.isArray(loanerSrc)){
    loaners = loanerSrc.map(l=>{
      if(typeof l === 'string') return { name:l, slug:null };
      return { name: l.name || l.vehicle_name || l.class_name || null,
               slug: l.slug || null };
    }).filter(l=>l.name);
  }

  // In-game aUEC purchase locations, if the ship is buyable in-game.
  let uecPrice = null;
  let uecLocations = [];
  let uecRentals = [];
  if(v.uex_prices){
    if(Array.isArray(v.uex_prices.purchase)){
      uecLocations = v.uex_prices.purchase
        .filter(p => typeof p.price_buy === 'number' && p.price_buy > 0)
        .map(p => ({
          price: p.price_buy,
          terminal: esc(p.terminal_name || p.terminal_code || 'Unknown terminal'),
          location: esc((p.starmap_location && p.starmap_location.name) || null) || null,
          parent: esc((p.starmap_location && p.starmap_location.parent_name) || null) || null,
          system: esc((p.starmap_location && p.starmap_location.star_system_name) || null) || null,
          updated: p.date_updated || null
        }));
      if(uecLocations.length) uecPrice = Math.min(...uecLocations.map(l=>l.price));
    }
    if(Array.isArray(v.uex_prices.rental)){
      uecRentals = v.uex_prices.rental
        .filter(p => typeof p.price_rent === 'number' && p.price_rent > 0)
        .map(p => ({
          price: p.price_rent,
          terminal: esc(p.terminal_name || p.terminal_code || 'Unknown terminal'),
          location: esc((p.starmap_location && p.starmap_location.name) || null) || null,
          system: esc((p.starmap_location && p.starmap_location.star_system_name) || null) || null
        }));
    }
  }

  return {
    id: v.uuid || v.slug || v.class_name,
    slug: v.slug,
    className: v.class_name || null,
    name: esc(v.name || v.class_name),
    manufacturer: esc((v.manufacturer && v.manufacturer.name) || "Unknown"),
    manufacturerCode: (v.manufacturer && v.manufacturer.code) || null,
    manufacturerLink: (v.manufacturer && v.manufacturer.link) || null,
    role: esc(foci),
    isGroundVehicle: isGroundVehicle,
    isSnub: isSnub,
    pitch: ag.pitch ?? null,
    yaw: ag.yaw ?? null,
    roll: ag.roll ?? null,
    pitchBoosted: ag.pitch_boosted ?? null,
    yawBoosted: ag.yaw_boosted ?? null,
    rollBoosted: ag.roll_boosted ?? null,
    boostForward: sp.boost_forward ?? null,
    boostBackward: sp.boost_backward ?? null,
    zeroToScm: sp.zero_to_scm ?? null,
    zeroToMax: sp.zero_to_max ?? null,
    accelMain: mainG,
    accelRetro: retroG,
    accelManeuver: mavG,
    seats: (v.crew && typeof v.crew === 'object') ? v.crew.max : (typeof v.crew === 'number' ? v.crew : null),
    status: status,
    image: img,
    thumb: thumb,
    crewMin: (v.crew && typeof v.crew === 'object') ? v.crew.min : (typeof v.crew === 'number' ? v.crew : null),
    crewMax: (v.crew && typeof v.crew === 'object') ? v.crew.max : (typeof v.crew === 'number' ? v.crew : null),
    cargoSCU: v.cargo_capacity || 0,
    length: v.dimension ? v.dimension.length : (v.sizes ? v.sizes.length : null),
    beam: v.dimension ? v.dimension.width : (v.sizes ? v.sizes.beam : null),
    height: v.dimension ? v.dimension.height : (v.sizes ? v.sizes.height : null),
    mass: v.mass_total || v.mass || null,
    scmSpeed: v.speed ? v.speed.scm : null,
    maxSpeed: v.speed ? v.speed.max : null,
    health: v.health || null,
    shieldHP: v.shield_hp || null,
    weapons: weapons,
    priceUSD: priceUSD,
    price: priceUSD != null ? `$${priceUSD}` : null,
    uecPrice: uecPrice,
    uecLocations: uecLocations,
    uecRentals: uecRentals,
    loaners: loaners,
    focus: esc((v.description && v.description.en_EN) ? v.description.en_EN : "No description available."),
    pledgeUrl: pledge,
    wikiUrl: v.web_url || null,
    hasMedbed: !!(v.max_medical_tier) || !!(v.seating && v.seating.medical_beds && Object.keys(v.seating.medical_beds).length > 0),
    medbedTiers: (v.seating && v.seating.medical_beds) ? Object.keys(v.seating.medical_beds) : (v.max_medical_tier ? [v.max_medical_tier] : []),
    hasBed: !!(v.seating && v.seating.beds > 0),
    hasCargoGrid: !!(v.cargo_grids && v.cargo_grids.length > 0),
    ...extractPortSummary(v)
  };
}

/* ---------- Data completeness ----------
   Some ships (especially capitals and unreleased concepts) have very sparse
   records upstream. We surface that explicitly so a gap in the source data
   doesn't look like a broken app. */
function dataCompleteness(s){
  const coreFields = [s.scmSpeed, s.maxSpeed, s.health, s.shieldHP, s.mass, s.length, s.priceUSD];
  const present = coreFields.filter(f => f != null && f !== 0).length;
  return { present, total: coreFields.length, sparse: present <= 3 };
}

/* ---------- Currency conversion ----------
   NOTE: CIG prices ships in USD. These are approximate static conversion rates
   for convenience only — they are NOT live exchange rates and will drift over
   time. The USD figure is always the authoritative one. RSI also applies its
   own regional pricing and VAT, so their checkout total will differ from a
   straight conversion. */
const CURRENCIES = {
  USD: { symbol:'$',   rate:1,     label:'USD' },
  EUR: { symbol:'€',   rate:0.92,  label:'EUR' },
  GBP: { symbol:'£',   rate:0.79,  label:'GBP' },
  CAD: { symbol:'C$',  rate:1.37,  label:'CAD' },
  AUD: { symbol:'A$',  rate:1.52,  label:'AUD' },
  UEC: { symbol:'',    rate:null,  label:'UEC (in-game)' }
};
let activeCurrency = 'USD';

function formatPrice(ship){
  if(activeCurrency === 'UEC'){
    return ship.uecPrice != null ? `${ship.uecPrice.toLocaleString()} UEC` : 'Not sold in-game';
  }
  if(ship.priceUSD == null) return '—';
  const c = CURRENCIES[activeCurrency];
  const converted = ship.priceUSD * c.rate;
  return `${c.symbol}${converted.toLocaleString(undefined,{maximumFractionDigits:0})}`;
}

function formatTotal(totalUSD){
  if(activeCurrency === 'UEC') return `${totalUSD.toLocaleString()} (USD basis)`;
  const c = CURRENCIES[activeCurrency];
  return `${c.symbol}${(totalUSD * c.rate).toLocaleString(undefined,{maximumFractionDigits:0})}`;
}

/* ---------- Fetch full roster from the live wiki API ---------- */
async function fetchAllShips(){
  setStatus("CONNECTING TO api.star-citizen.wiki …", "loading");
  SHIPS = [];
  let page = 1;
  let gotAnyPage = false;

  while(page <= MAX_PAGES){
    const url = `${API_BASE}?page[number]=${page}&page[size]=${PAGE_SIZE}`;
    try{
      const res = await fetchWithTimeout(url, FETCH_TIMEOUT_MS);
      if(!res.ok) throw new Error(`HTTP ${res.status}`);
      const json = await res.json();
      const data = json.data || [];
      if(data.length === 0) break;

      SHIPS = SHIPS.concat(data.map(mapVehicle));
      gotAnyPage = true;

      // Surface which game data version the roster reflects, so missing
      // newly-announced ships are explainable rather than mysterious.
      if(data[0] && data[0].version){
        document.getElementById('data-version').textContent = `GAME DATA ${data[0].version}`;
      }

      // Progressive render: show ships as soon as the first page lands,
      // don't make the user wait for the whole roster.
      document.getElementById('skeleton').style.display = 'none';
      document.getElementById('ship-count').textContent = `${SHIPS.length} SHIPS`;
      setStatus(`LOADING ROSTER… ${SHIPS.length} VESSELS INDEXED (page ${page})`, "loading");
      buildRoleFilters();
      buildStatusFilters();
      renderList();

      const lastPage = json.meta && (json.meta.last_page || (json.meta.pagination && json.meta.pagination.last_page));
      if(!lastPage || page >= lastPage || data.length < PAGE_SIZE){
        setStatus(`LIVE ROSTER LOADED — ${SHIPS.length} VESSELS`, "ok");
        break;
      }
      page++;
    }catch(err){
      // Stop paging on error, but KEEP whatever pages already loaded successfully
      // rather than discarding progress.
      if(!gotAnyPage){
        setStatus(`LIVE FETCH FAILED (${err.message}) — showing sample data instead.`, "error");
        SHIPS = FALLBACK_SHIPS;
      }else{
        setStatus(`LOADED ${SHIPS.length} VESSELS — stopped early (${err.message})`, "error");
      }
      break;
    }
  }

  document.getElementById('skeleton').style.display = 'none';
  document.getElementById('ship-count').textContent = `${SHIPS.length} SHIPS`;
  if(gotAnyPage){
    SHIPS = dedupeByName(SHIPS);
    backfillVariantImages(SHIPS);
    populateDockShipSelect();
    populateManufacturerFilter();
    setTimeout(()=>{ 
      const el = document.getElementById('status-banner');
      if(el.classList.contains('ok') || el.classList.contains('loading')) el.style.display='none';
    }, 4000);
  }
  reconcileHangar();
  applyHashRoute();
  buildRoleFilters();
  buildStatusFilters();
  renderList();
  if(document.getElementById('home-view').classList.contains('open')) renderHome();
}

/* ---------- Collapse duplicate entries that share an identical display name ---------- */
/* The source data carries separate records per store SKU (different paint jobs,
   subscriber flair, etc.) that often don't get a distinct name — e.g. three
   separate "Idris-P" entries. We keep the single best-quality record per name. */
function scoreShip(s){
  let sc = 0;
  if(s.image) sc += 10;
  if(s.price) sc += 2;
  if(s.pledgeUrl) sc += 2;
  if(s.wikiUrl) sc += 1;
  if(s.focus && s.focus !== "No description available.") sc += 2;
  if(s.weapons && s.weapons.length) sc += 1;
  return sc;
}

function dedupeByName(ships){
  const groups = {};
  ships.forEach(s=>{
    const key = (s.manufacturer + '::' + s.name).trim().toLowerCase();
    (groups[key] = groups[key] || []).push(s);
  });
  const result = [];
  Object.values(groups).forEach(group=>{
    if(group.length === 1){ result.push(group[0]); return; }
    let best = group[0], bestScore = scoreShip(best);
    for(let i=1;i<group.length;i++){
      const sc = scoreShip(group[i]);
      if(sc > bestScore){ best = group[i]; bestScore = sc; }
    }
    result.push(best);
  });
  return result;
}

/* ---------- Borrow base-ship image for variant/livery entries with no photo ---------- */
function backfillVariantImages(ships){
  // Sort candidates by name length ascending so we prefer matching the shortest
  // (most "base") name as the parent when multiple partial matches exist.
  const byManufacturer = {};
  ships.forEach(s=>{
    if(!s.image) return;
    (byManufacturer[s.manufacturer] = byManufacturer[s.manufacturer] || []).push(s);
  });
  Object.values(byManufacturer).forEach(list=> list.sort((a,b)=> a.name.length - b.name.length));

  ships.forEach(s=>{
    if(s.image) return;
    const candidates = byManufacturer[s.manufacturer];
    if(!candidates) return;
    const parent = candidates.find(c => c.id !== s.id && s.name.startsWith(c.name + ' '));
    if(parent){
      s.image = parent.image;
      s.thumb = parent.thumb;
      s.imageBorrowed = true;
    }
  });
}

/* ---------- Filters / list rendering ---------- */
function buildRoleFilters(){
  const roles = ["ALL", ...new Set(SHIPS.map(s=>s.role).filter(Boolean))].sort((a,b)=> a==="ALL"?-1: a.localeCompare(b));
  const el = document.getElementById('filters');
  el.innerHTML = roles.map(r=>`<button class="chip ${r===activeRole?'active':''}" data-role="${r}">${r}</button>`).join('');
  el.querySelectorAll('.chip').forEach(c=>c.addEventListener('click', ()=>{
    activeRole = c.dataset.role; buildRoleFilters(); renderList();
  }));
}

function buildStatusFilters(){
  const statuses = ["ALL", ...new Set(SHIPS.map(s=>s.status).filter(Boolean))];
  const el = document.getElementById('status-filters');
  el.innerHTML = statuses.map(s=>`<button class="chip ${s===activeStatus?'active':''}" data-status="${s}">${s==='ALL'?'ALL STATUSES':s.replace(/-/g,' ')}</button>`).join('');
  el.querySelectorAll('.chip').forEach(c=>c.addEventListener('click', ()=>{
    activeStatus = c.dataset.status; buildStatusFilters(); renderList();
  }));
}

function sortShips(list){
  const arr = [...list];
  if(sortKey==="name") arr.sort((a,b)=> a.name.localeCompare(b.name));
  if(sortKey==="manufacturer") arr.sort((a,b)=> a.manufacturer.localeCompare(b.manufacturer) || a.name.localeCompare(b.name));
  if(sortKey==="cargo") arr.sort((a,b)=> (b.cargoSCU||0) - (a.cargoSCU||0));
  if(sortKey==="price") arr.sort((a,b)=>{
    const pa = a.priceUSD != null ? a.priceUSD : -1;
    const pb = b.priceUSD != null ? b.priceUSD : -1;
    return pb - pa;
  });
  return arr;
}

function matchSeatBand(seats, band){
  if(band === 'ANY') return true;
  if(seats == null) return false;
  if(band === '1') return seats === 1;
  if(band === '2') return seats === 2;
  if(band === '3-4') return seats >= 3 && seats <= 4;
  if(band === '5-9') return seats >= 5 && seats <= 9;
  if(band === '10+') return seats >= 10;
  return true;
}

function countActiveFilters(){
  let n = 0;
  if(activeRole !== 'ALL') n++;
  if(activeManufacturer !== 'ALL') n++;
  if(activeStatus !== 'ALL') n++;
  if(seatFilter !== 'ANY') n++;
  if(excludeGround) n++;
  if(excludeSnub) n++;
  if(minCargoFilter > 0) n++;
  if(advMedbed !== 'OFF') n++;
  if(advBed) n++;
  if(advCargoGrid) n++;
  if(advBuyable) n++;
  if(advHardpointSize !== 'OFF') n++;
  if(advCompType !== 'OFF' && advCompSize !== 'OFF') n++;
  if(advDockShip !== 'OFF') n++;
  if(fminScm > 0) n++;
  if(fminPitch > 0) n++;
  if(fminYaw > 0) n++;
  if(fminRoll > 0) n++;
  if(fminAccel > 0) n++;
  return n;
}

function updateActiveFilterBadge(){
  const el = document.getElementById('active-filter-count');
  if(!el) return;
  const n = countActiveFilters();
  el.textContent = n;
  el.style.display = n > 0 ? '' : 'none';
}

function getFilteredShips(){
  const q = activeQuery.trim().toLowerCase();
  const dockTarget = advDockShip !== 'OFF' ? SHIPS.find(x=>x.id===advDockShip) : null;

  let filtered = SHIPS.filter(s=>{
    const roleMatch = activeRole==="ALL" || s.role===activeRole;
    const mfgMatch = activeManufacturer==="ALL" || s.manufacturer===activeManufacturer;
    const statusMatch = activeStatus==="ALL" || s.status===activeStatus;
    const qMatch = !q || s.name.toLowerCase().includes(q) || s.manufacturer.toLowerCase().includes(q);
    const hangarMatch = !viewingHangar || hangarIds.has(s.id);
    const cargoMatch = (s.cargoSCU||0) >= minCargoFilter;
    const seats = s.seats != null ? s.seats : (s.crewMax != null ? s.crewMax : null);
    const crewMatch = matchSeatBand(seats, seatFilter);
    const groundMatch = !excludeGround || !s.isGroundVehicle;
    const snubMatch = !excludeSnub || !s.isSnub;
    // Flight minimums: a ship with no data for a stat is excluded once that
    // filter is active, since we can't verify it meets the threshold.
    const flightMatch =
      (fminScm   === 0 || (s.scmSpeed  != null && s.scmSpeed  >= fminScm)) &&
      (fminPitch === 0 || (s.pitch     != null && s.pitch     >= fminPitch)) &&
      (fminYaw   === 0 || (s.yaw       != null && s.yaw       >= fminYaw)) &&
      (fminRoll  === 0 || (s.roll      != null && s.roll      >= fminRoll)) &&
      (fminAccel === 0 || (s.accelMain != null && s.accelMain >= fminAccel));

    const medbedMatch = advMedbed === 'OFF' || (advMedbed === 'ANY' ? s.hasMedbed : (s.medbedTiers||[]).includes(advMedbed));
    const bedMatch = !advBed || s.hasBed;
    const cargoGridMatch = !advCargoGrid || s.hasCargoGrid;
    const buyableMatch = !advBuyable || (s.uecLocations && s.uecLocations.length > 0);
    const hardpointMatch = advHardpointSize === 'OFF' || (s.hardpointSizes||[]).includes(Number(advHardpointSize));
    const componentMatch = (advCompType === 'OFF' || advCompSize === 'OFF')
      ? true
      : ((s.componentSizesByType && s.componentSizesByType[advCompType]) || []).includes(Number(advCompSize));
    const dockMatch = !dockTarget || (
      s.id !== dockTarget.id &&
      (s.length||0) <= (dockTarget.length||Infinity) &&
      (s.beam||0) <= (dockTarget.beam||Infinity) &&
      (s.height||0) <= (dockTarget.height||Infinity)
    );

    return roleMatch && mfgMatch && statusMatch && qMatch && hangarMatch && cargoMatch && crewMatch
      && medbedMatch && bedMatch && cargoGridMatch && buyableMatch && hardpointMatch && componentMatch && dockMatch && groundMatch && snubMatch && flightMatch;
  });
  return sortShips(filtered);
}

function renderList(){
  const list = document.getElementById('list');
  const filtered = getFilteredShips();

  if(filtered.length===0){
    if(viewingHangar){
      list.innerHTML = `<div class="empty-state">YOUR HANGAR IS EMPTY<br>Tap the ☆ on any ship to add it here</div>`;
    }else{
      list.innerHTML = `<div class="empty-state">NO VESSELS MATCH QUERY<br>[ ${SHIPS.length} SHIPS IN REGISTRY ]</div>`;
    }
    updateHangarSummary();
    updateActiveFilterBadge();
    return;
  }

  list.innerHTML = filtered.map(s=>`
    <div class="row" data-id="${s.id}">
      <div class="thumb">
        ${s.thumb ? `<img src="${s.thumb}" alt="" loading="lazy" onerror="this.parentElement.textContent='${(s.manufacturer||'').split(' ').map(w=>w[0]).join('').slice(0,2)}';">` : (s.manufacturer||'').split(' ').map(w=>w[0]).join('').slice(0,2)}
      </div>
      <div class="info">
        <div class="name">${s.name}</div>
        <div class="manu">${s.manufacturer} · ${fmt(s.cargoSCU)} SCU · ${(s.seats!=null? s.seats : (s.crewMax!=null? s.crewMax : '—'))} seat${s.seats===1?'':'s'}${dataCompleteness(s).sparse ? ' <span style="color:var(--amber);" title="Limited data upstream">◍</span>' : ''}</div>

      <button class="compare-btn ${compareIds.has(s.id)?'selected':''}" data-compare-id="${s.id}" aria-label="Toggle compare">${compareIds.has(s.id)?'✓':'+'}</button>
      <div class="role">${s.role}</div>
    </div>
  `).join('');

  list.querySelectorAll('.row').forEach(r=>r.addEventListener('click', (e)=>{
    if(e.target.closest('.hangar-star') || e.target.closest('.compare-btn')) return;
    openDetail(r.dataset.id);

  list.querySelectorAll('.hangar-star').forEach(btn=>btn.addEventListener('click', (e)=>{

    toggleHangar(btn.dataset.hangarId);
  }));
  list.querySelectorAll('.compare-btn').forEach(btn=>btn.addEventListener('click', (e)=>{
    e.stopPropagation();
    toggleCompare(btn.dataset.compareId);
  }));
  updateHangarSummary();
  updateActiveFilterBadge();
}

function renderSimilarShips(current){

    .slice(0, 3);

  return `

}

/* Human-friendly labels for the API's port type strings. Anything not listed
   falls back to the raw type with spaces inserted, rather than being hidden. */
const PORT_LABELS = {
  WeaponGun:'Weapons', Turret:'Turrets', TurretBase:'Turrets',
  MissileLauncher:'Missile Racks', Missile:'Missiles',
  Shield:'Shield Generators', PowerPlant:'Power Plants', Cooler:'Coolers',
  QuantumDrive:'Quantum Drives', FuelIntake:'Fuel Intakes', FuelTank:'Fuel Tanks',
  QuantumFuelTank:'Quantum Fuel Tanks', MainThruster:'Main Thrusters',
  ManneuverThruster:'Maneuvering Thrusters', ManeuverThruster:'Maneuvering Thrusters',
  Radar:'Radar', Computer:'Computers', SelfDestruct:'Self Destruct',
  Cargo:'Cargo Grids', Countermeasure:'Countermeasures', Ping:'Ping',
  Scanner:'Scanners', MiningArm:'Mining Arms', SalvageModifier:'Salvage Gear',
  TractorBeam:'Tractor Beams', Seat:'Seats', Bed:'Beds', Door:'Doors',
  Light:'Lights', Armor:'Armor', Paint:'Paint'
};

// Order the important stuff first; everything else follows alphabetically.
const PORT_ORDER = ['WeaponGun','Turret','TurretBase','MissileLauncher','Missile',
  'Shield','PowerPlant','Cooler','QuantumDrive','MainThruster','ManneuverThruster',
  'ManeuverThruster','Radar','Countermeasure','FuelTank','QuantumFuelTank','FuelIntake'];

function prettyPortType(t){
  if(PORT_LABELS[t]) return PORT_LABELS[t];
  return String(t).replace(/([a-z])([A-Z])/g, '$1 $2');
}

/* Build Erkul's ship identifier.
   Verified format: https://erkul.games/ships?ship=orig_100i
   i.e. lowercase manufacturer code + underscore + ship name.
   The wiki API's class_name ("ORIG_100i") maps directly; slug ("orig-100i")
   needs hyphens swapped. Falls back to manufacturer code + name. */
const MFG_CODE_FALLBACK = {
  'Origin Jumpworks':'ORIG', 'Anvil Aerospace':'ANVL', 'Aegis Dynamics':'AEGS',
  'Drake Interplanetary':'DRAK', 'Roberts Space Industries':'RSI',
  'Musashi Industrial & Starflight Concern':'MISC', 'MISC':'MISC',
  'Consolidated Outland':'CNOU', 'Crusader Industries':'CRUS',
  'Argo Astronautics':'ARGO', 'Esperia':'ESPR', 'Banu':'BANU',
  'Kruger Intergalactic':'KRIG', 'Tumbril Land Systems':'TMBL',
  'Greycat Industrial':'GRIN', 'Mirai':'MRAI', 'Vanduul':'VNCL',
  'Aopoa':'XIAN', 'Gatac Manufacture':'GATA', 'RSI':'RSI'
};

function erkulShipId(s){
  // Preferred: the game class name, which is already CODE_Name
  if(s.className && /_/.test(s.className)){
    return s.className.toLowerCase();
  }
  // Next: the wiki slug, which is code-name
  if(s.slug && /-/.test(s.slug)){
    return s.slug.toLowerCase().replace(/-/g, '_');
  }
  // Last resort: assemble from manufacturer code + name
  const code = s.manufacturerCode || MFG_CODE_FALLBACK[s.manufacturer];
  if(code && s.name){
    const namePart = String(s.name).trim().replace(/\s+/g, '_').replace(/[^A-Za-z0-9_]/g, '');
    return (code + '_' + namePart).toLowerCase();
  }
  return null;
}

/* External tool links.
   VERIFIED: spviewer.eu/performance?ship=<id>  (aegs_avenger_stalker)
   Erkul's calculator takes no ship parameter, so it links to the tool root
   and tells the user to search.
   Erkul's Ship Finder is deliberately NOT linked: VERSEDEX already shows
   in-game buy/rent locations and prices per terminal, so it would be
   redundant. erkulShipId is still used to build the SPViewer link. */
function erkulCalculatorUrl(){
  return 'https://erkul.games/calculator';
}

/* VERIFIED: spviewer.eu/performance?ship=aegs_avenger_stalker
   Uses the same manufacturer-code + name convention as Erkul, so erkulShipId
   serves both. */
function spviewerUrl(s){
  const id = erkulShipId(s);
  return id ? `https://www.spviewer.eu/performance?ship=${encodeURIComponent(id)}`
            : 'https://www.spviewer.eu/performance';
}

function renderHardpoints(s){
  const groups = s.portGroups || {};
  const types = Object.keys(groups);
  if(types.length === 0) return '';

  types.sort((a,b)=>{
    const ia = PORT_ORDER.indexOf(a), ib = PORT_ORDER.indexOf(b);
    if(ia !== -1 && ib !== -1) return ia - ib;
    if(ia !== -1) return -1;
    if(ib !== -1) return 1;
    return prettyPortType(a).localeCompare(prettyPortType(b));
  });

  const rows = types.map(type=>{
    const sizes = Object.keys(groups[type]).map(Number).sort((a,b)=>b-a);
    const total = sizes.reduce((acc,sz)=>acc + groups[type][sz], 0);
    const chips = sizes.map(sz=>
      `<span class="hp-chip">${groups[type][sz]}× <strong>S${sz}</strong></span>`).join('');
    return `
      <div class="hp-row">
        <div class="hp-type">
          <div class="hp-name">${prettyPortType(type)}</div>
          <div class="hp-total">${total} slot${total===1?'':'s'}</div>
        </div>
        <div class="hp-chips">${chips}</div>
      </div>`;
  }).join('');

  return `
    <div class="section-label">Hardpoints &amp; Slots</div>
    <div class="hp-list">${rows}</div>
    <div class="ext-tools">
      <a class="ext-link" href="${erkulCalculatorUrl()}" target="_blank" rel="noopener">
        <div class="ext-name">Erkul <span>↗</span></div>
        <div class="ext-desc">Fit a loadout — DPS, shields, power draw. Search for ${esc(s.name)} once open.</div>
      </a>
      <a class="ext-link" href="${spviewerUrl(s)}" target="_blank" rel="noopener">
        <div class="ext-name">SPViewer <span>↗</span></div>
        <div class="ext-desc">Opens on ${esc(s.name)}. Fuel, quantum range, capacitors and endurance.</div>
      </a>
    </div>
    <div class="tool-note" style="padding:8px 16px 0;">
      Slot sizes come from the ship's game data. For building loadouts or digging into raw
      performance, these tools are the community standard — VERSEDEX links out rather than duplicating them.
    </div>
  `;
}

function renderFlightPerformance(s){
  const has = [s.pitch, s.yaw, s.roll, s.accelMain, s.boostForward, s.zeroToScm]
    .some(v => v != null && v !== 0);
  if(!has) return '';

  const n = (v, d=1) => v == null ? '—' : Number(v).toFixed(d).replace(/\.0$/,'');

  const rows = [];

  if(s.scmSpeed != null || s.boostForward != null){
    rows.push(`<div class="fp-row">
      <div><div class="fp-label">SCM / Forward Boost</div></div>
      <div class="fp-val">${s.scmSpeed!=null?fmt(s.scmSpeed):'—'} / ${s.boostForward!=null?fmt(s.boostForward):'—'}<small>m/s</small></div>
    </div>`);
  }
  if(s.maxSpeed != null){
    rows.push(`<div class="fp-row">
      <div><div class="fp-label">NAV Max</div></div>
      <div class="fp-val">${fmt(s.maxSpeed)}<small>m/s</small></div>
    </div>`);
  }
  if(s.zeroToScm != null || s.zeroToMax != null){
    rows.push(`<div class="fp-row">
      <div><div class="fp-label">0 → SCM / 0 → NAV</div></div>
      <div class="fp-val">${n(s.zeroToScm,2)} / ${n(s.zeroToMax,2)}<small>s</small></div>
    </div>`);
  }
  if(s.pitch != null || s.yaw != null || s.roll != null){
    rows.push(`<div class="fp-row">
      <div>
        <div class="fp-label">Pitch / Yaw / Roll</div>
        ${(s.pitchBoosted!=null)?`<div class="fp-sub">Boosted values in cyan</div>`:''}
      </div>
      <div style="text-align:right;">
        <div class="fp-val">${n(s.pitch)} / ${n(s.yaw)} / ${n(s.roll)}<small>°/s</small></div>
        ${(s.pitchBoosted!=null)?`<div class="fp-val"><span class="boosted">${n(s.pitchBoosted)} / ${n(s.yawBoosted)} / ${n(s.rollBoosted)}</span><small>°/s</small></div>`:''}
      </div>
    </div>`);
  }
  if(s.accelMain != null){
    rows.push(`<div class="fp-row">
      <div><div class="fp-label">Main Acceleration</div></div>
      <div class="fp-val">${n(s.accelMain,2)}<small>G</small></div>
    </div>`);
  }
  if(s.accelRetro != null){
    rows.push(`<div class="fp-row">
      <div><div class="fp-label">Retro Acceleration</div></div>
      <div class="fp-val">${n(s.accelRetro,2)}<small>G</small></div>
    </div>`);
  }
  if(s.accelManeuver != null){
    rows.push(`<div class="fp-row">
      <div><div class="fp-label">Maneuvering Thrust</div></div>
      <div class="fp-val">${n(s.accelManeuver,2)}<small>G</small></div>
    </div>`);
  }

  return `
    <div class="section-label">Flight Performance</div>
    <div class="flight-panel">${rows.join('')}</div>
  `;
}

function renderInGamePurchase(s){
  if((!s.uecLocations || s.uecLocations.length === 0) && (!s.uecRentals || s.uecRentals.length === 0)){
    return `
      <div class="section-label">In-Game Purchase</div>
      <div style="padding:0 16px; font-family:'Share Tech Mono',monospace; font-size:11px; color:var(--muted); line-height:1.6;">
        Not currently sold or rentable in-game — pledge store only.
      </div>`;
  }

  const buyRows = (s.uecLocations||[]).map(l => `
    <div class="uec-row">
      <div class="uec-loc">
        <div class="uec-terminal">${l.terminal}</div>
        <div class="uec-place">${[l.location, l.parent, l.system].filter(Boolean).join(' · ')}</div>
      </div>
      <div class="uec-price">${l.price.toLocaleString()} <small>aUEC</small></div>

  const rentRows = (s.uecRentals||[]).map(l => `

    </div>`).join('');

  return `

      <div class="section-label">Buy In-Game (${s.uecLocations.length} location${s.uecLocations.length===1?'':'s'})</div>

      In-game prices sourced via UEX and can shift between patches.
    </div>
  `;
}

/* Rent vs buy: how many days of renting equals the purchase price. */
function renderRentVsBuy(s){
  const buy = s.uecPrice;
  const rentals = (s.uecRentals || []).filter(r=>r.price > 0);
  if(!buy || rentals.length === 0) return '';

  const cheapestRent = Math.min(...rentals.map(r=>r.price));
  const days = Math.floor(buy / cheapestRent);
  if(!isFinite(days) || days <= 0) return '';

  return `
    <div class="section-label">Rent or Buy?</div>
    <div class="rvb-panel">
      <div class="rvb-headline">Renting is cheaper for the first <span>${fmt(days)}</span> day${days===1?'':'s'}</div>
      <div class="rvb-line"><span>Cheapest rental</span><strong>${fmt(cheapestRent)} aUEC/day</strong></div>
      <div class="rvb-line"><span>Purchase price</span><strong>${fmt(buy)} aUEC</strong></div>
      <div class="rvb-line"><span>Break-even</span><strong>day ${fmt(days + 1)}</strong></div>
      <div class="rvb-bar">
        <div class="rvb-fill" style="width:${Math.min(100, Math.round(days / (days + 10) * 100))}%;"></div>
      </div>
      <div class="rvb-note">Rent for short jobs, buy if you'll use it beyond ${fmt(days)} days. Rentals don't accrue toward ownership.</div>
    </div>`;
}

/* Loaner ships granted while a pledge isn't flyable yet. */
function renderLoaners(s){

/* ---- Cargo efficiency: SCU per unit cost ---- */
let effState = { metric:'usd', role:'ALL', minScu:0 };

function renderEfficiencyTool(){
  const cargoShips = SHIPS.filter(s => (s.cargoSCU||0) > 0);

  // Roles that actually have cargo ships, so the filter never shows dead options
  const roles = ['ALL', ...new Set(cargoShips.map(s=>s.role).filter(Boolean))].sort((a,b)=>
    a==='ALL' ? -1 : b==='ALL' ? 1 : a.localeCompare(b));

  const pool = cargoShips.filter(s =>
    (effState.role === 'ALL' || s.role === effState.role) &&
    (s.cargoSCU || 0) >= effState.minScu
  );

  const usingUsd = effState.metric === 'usd';
  const ranked = pool
    .filter(s => usingUsd ? (s.priceUSD != null && s.priceUSD > 0)
                          : (s.uecPrice != null && s.uecPrice > 0))
    .map(s => ({
      s,
      value: usingUsd ? s.cargoSCU / s.priceUSD
                      : s.cargoSCU / s.uecPrice * 1000000,
      cost: usingUsd ? `$${s.priceUSD}` : `${(s.uecPrice/1000000).toFixed(2)}M aUEC`
    }))
    .sort((a,b)=> b.value - a.value);

  const top = ranked.slice(0, 30);
  const best = top[0];
  const worst = ranked[ranked.length - 1];

  document.getElementById('tools-body').innerHTML = `
    <div class="explainer">
      <div class="ex-title">What this shows</div>
      <div class="ex-body">
        How much cargo space each ship gives you <strong>per unit of cost</strong>. A higher score means
        better value for hauling — you're paying less for every SCU you can carry.
        ${usingUsd
          ? `<br><br><strong>SCU per $1</strong> uses the real-money pledge price. Useful when deciding what to buy with cash.`
          : `<br><br><strong>SCU per 1M aUEC</strong> uses the in-game purchase price. Useful when deciding what to save up for.`}
        <br><br>This only measures cargo value — it ignores speed, defences, and whether the ship is
        pleasant to fly. A cheap hauler that dies to the first pirate isn't really efficient.
      </div>
    </div>

    <div class="tool-field">
      <label>Measure by</label>
      <div class="filters" id="eff-metric">
        <button class="chip ${usingUsd?'active':''}" data-metric="usd">SCU PER $1</button>
        <button class="chip ${!usingUsd?'active':''}" data-metric="uec">SCU PER 1M aUEC</button>
      </div>
    </div>

    <div class="tool-field">
      <label>Role</label>
      <select id="eff-role" class="adv-select">
        ${roles.map(r=>`<option value="${esc(r)}"${r===effState.role?' selected':''}>${r==='ALL'?'All roles':esc(r)}</option>`).join('')}
      </select>
    </div>

    <div class="tool-field">
      <label>Minimum cargo: <span style="color:var(--cyan);">${fmt(effState.minScu)}</span> SCU</label>
      <input type="range" id="eff-scu" min="0" max="500" step="10" value="${effState.minScu}"
             style="width:100%; accent-color:var(--cyan);">
    </div>

    ${top.length === 0 ? `
      <div class="tool-note">
        No ships match those filters with ${usingUsd ? 'a pledge price' : 'an in-game price'}.
        Try widening the role or lowering the minimum cargo.
      </div>` : `
      ${best ? `
        <div class="eff-highlight">
          <div class="ex-title" style="color:var(--amber);">Best value right now</div>
          <div class="eh-name">${best.s.name}</div>
          <div class="eh-detail">${fmt(best.s.cargoSCU)} SCU for ${best.cost} —
            <strong>${usingUsd ? best.value.toFixed(2)+' SCU per $1' : best.value.toFixed(1)+' SCU per 1M aUEC'}</strong></div>
          ${worst && worst.s.id !== best.s.id ? `<div class="eh-compare">That's ${(best.value / worst.value).toFixed(1)}× better value than the ${worst.s.name} at the bottom of this list.</div>` : ''}
        </div>` : ''}

      <div class="section-label">Ranked ${top.length}${ranked.length > 30 ? ' of ' + ranked.length : ''}</div>
      ${top.map((e,i)=>{
        const pct = best ? Math.max(4, Math.round(e.value / best.value * 100)) : 100;
        return `
        <div class="eff-row" data-eff-id="${e.s.id}" style="cursor:pointer;">
          <div class="eff-rank">${String(i+1).padStart(2,'0')}</div>
          <div class="sim-thumb">${e.s.thumb?`<img src="${e.s.thumb}" alt="" loading="lazy">`:esc((e.s.manufacturer||'').slice(0,2))}</div>
          <div style="flex:1; min-width:0;">

        </div>`;
      }).join('')}

    <div class="tool-note">

/* ---- ROI: how long until a ship pays for itself ---- */
function renderRoiTool(){
  const cargoShips = SHIPS.filter(s => (s.cargoSCU||0) > 0 && s.uecPrice != null && s.uecPrice > 0)
    .sort((a,b)=>a.name.localeCompare(b.name));

  if(cargoShips.length === 0){
    document.getElementById('tools-body').innerHTML =
      `<div class="tool-note">No ships currently have both cargo capacity and an in-game aUEC price, so ROI can't be calculated.</div>`;
    return;
  }

  if(!roiState.shipId || !cargoShips.find(s=>s.id===roiState.shipId)){
    roiState.shipId = cargoShips[0].id;
  }
  const ship = cargoShips.find(s=>s.id===roiState.shipId);

  // Load factor: how much cargo you actually carry per run. Defaults to full,
  // but real missions rarely fill a hold exactly.
  if(roiState.loadScu == null || roiState.loadScu > ship.cargoSCU){
    roiState.loadScu = ship.cargoSCU;
  }
  const load = Math.max(0, Math.min(roiState.loadScu, ship.cargoSCU));
  const loadPct = ship.cargoSCU > 0 ? Math.round(load / ship.cargoSCU * 100) : 0;

  const profitPerRun = load * roiState.profitPerSCU;
  const runsToPayOff = profitPerRun > 0 ? Math.ceil(ship.uecPrice / profitPerRun) : null;
  const totalMinutes = runsToPayOff != null ? runsToPayOff * roiState.minutesPerRun : null;
  const hours = totalMinutes != null ? (totalMinutes / 60) : null;
  const profitPerHour = roiState.minutesPerRun > 0 ? (profitPerRun / roiState.minutesPerRun) * 60 : 0;

  document.getElementById('tools-body').innerHTML = `
    <div class="explainer">
      <div class="ex-title">What this shows</div>
      <div class="ex-body">
        How many cargo runs you'd need to earn a ship <strong>in-game</strong>, instead of buying it with real money.
        Set your own numbers below — profit per SCU varies hugely by commodity, and how long a run takes
        depends on the route and how much trouble you hit.
      </div>
    </div>

    <div class="tool-field">
      <label>Ship</label>
      <select id="roi-ship">
        ${cargoShips.map(s=>`<option value="${s.id}" ${s.id===roiState.shipId?'selected':''}>${s.name} — ${fmt(s.cargoSCU)} SCU</option>`).join('')}
      </select>
    </div>

    <div class="tool-field">
      <label>Cargo loaded: <span style="color:var(--cyan);">${fmt(load)}</span> / ${fmt(ship.cargoSCU)} SCU (${loadPct}%)</label>
      <input type="range" id="roi-load" min="0" max="${ship.cargoSCU}" step="1" value="${load}" style="width:100%; accent-color:var(--cyan); padding:0;">
      <div style="display:flex; gap:6px; margin-top:4px;">
        <button class="chip" data-load="25">25%</button>
        <button class="chip" data-load="50">50%</button>
        <button class="chip" data-load="75">75%</button>
        <button class="chip" data-load="100">FULL</button>
      </div>
    </div>

    <div class="tool-field">
      <label>Profit per SCU (aUEC)</label>
      <input type="number" id="roi-profit" value="${roiState.profitPerSCU}" min="1" step="10">
    </div>

    <div class="tool-field">
      <label>Minutes per run (buy → travel → sell)</label>
      <input type="number" id="roi-minutes" value="${roiState.minutesPerRun}" min="1" step="5">
    </div>

    <div class="roi-result">
      <div style="font-family:'Share Tech Mono',monospace; font-size:10px; color:var(--muted); letter-spacing:1px;">RUNS TO PAY OFF</div>
      <div class="roi-big">${runsToPayOff != null ? fmt(runsToPayOff) : '—'}</div>
      <div style="margin-top:12px;">
        <div class="roi-line"><span class="rk">Ship cost (in-game)</span><span class="rv">${fmt(ship.uecPrice)} aUEC</span></div>
        <div class="roi-line"><span class="rk">Cargo per run</span><span class="rv">${fmt(load)} / ${fmt(ship.cargoSCU)} SCU</span></div>
        <div class="roi-line"><span class="rk">Profit per run</span><span class="rv">${fmt(profitPerRun)} aUEC</span></div>
        <div class="roi-line"><span class="rk">Profit per hour</span><span class="rv">${fmt(Math.round(profitPerHour))} aUEC/hr</span></div>
        <div class="roi-line"><span class="rk">Estimated time</span><span class="rv">${hours != null ? (hours < 1 ? Math.round(totalMinutes)+' min' : hours.toFixed(1)+' hrs') : '—'}</span></div>
      </div>
    </div>

    <div class="tool-note">
      Estimates only. Assumes the load above every run, no losses, and a constant profit margin — real runs vary with
      stock levels, server performance and piracy. Profit per SCU differs hugely by commodity; check a live trade
      tool such as UEX or SC Trade Tools for current margins.
    </div>
  `;

  document.getElementById('roi-ship').addEventListener('change', e=>{
    roiState.shipId = e.target.value;
    roiState.loadScu = null; // reset to full for the newly selected ship
    renderRoiTool();
  });
  document.getElementById('roi-load').addEventListener('input', e=>{
    roiState.loadScu = Number(e.target.value);
    renderRoiTool();
  });
  document.querySelectorAll('[data-load]').forEach(btn=>btn.addEventListener('click', ()=>{
    roiState.loadScu = Math.round(ship.cargoSCU * Number(btn.dataset.load) / 100);
    renderRoiTool();
  }));
  document.getElementById('roi-profit').addEventListener('change', e=>{ roiState.profitPerSCU = Math.max(0, Number(e.target.value)||0); renderRoiTool(); });
  document.getElementById('roi-minutes').addEventListener('change', e=>{ roiState.minutesPerRun = Math.max(1, Number(e.target.value)||1); renderRoiTool(); });
}

/* ---- Budget: what can I actually afford in-game right now ---- */
let budgetState = { balance: 1000000, mode: 'buy' };

function renderBudgetTool(){
  const bal = budgetState.balance;
  const mode = budgetState.mode;

  let candidates;
  if(mode === 'buy'){
    candidates = SHIPS.filter(s => s.uecPrice != null && s.uecPrice > 0 && s.uecPrice <= bal)
      .map(s => ({ s, cost: s.uecPrice }));
  }else{
    candidates = SHIPS
      .filter(s => (s.uecRentals||[]).some(r=>r.price > 0))
      .map(s => ({ s, cost: Math.min(...s.uecRentals.filter(r=>r.price>0).map(r=>r.price)) }))
      .filter(e => e.cost <= bal);
  }

  candidates.sort((a,b)=> b.cost - a.cost);   // best you can afford first
  const affordable = candidates.slice(0, 40);

  const cheapestOverall = SHIPS
    .filter(s => s.uecPrice != null && s.uecPrice > 0)
    .sort((a,b)=>a.uecPrice - b.uecPrice)[0];

  document.getElementById('tools-body').innerHTML = `
    <div class="explainer">
      <div class="ex-title">What this shows</div>
      <div class="ex-body">
        Every ship you could <strong>buy or rent in-game right now</strong> at your current balance,
        most expensive first — so the top of the list is the best thing within reach.
        Ships only sold in the pledge store aren't included.
      </div>
    </div>

    <div class="tool-field">
      <label>Your balance (aUEC)</label>
      <input type="number" id="budget-input" value="${bal}" min="0" step="50000">

    <div class="tool-field">
      <label>Mode</label>
      <div class="filters" id="budget-mode">
        <button class="chip ${mode==='buy'?'active':''}" data-mode="buy">BUY OUTRIGHT</button>
        <button class="chip ${mode==='rent'?'active':''}" data-mode="rent">RENT PER DAY</button>
      </div>
    </div>

    ${affordable.length === 0 ? `
      <div class="tool-note">
        Nothing ${mode==='rent'?'rentable':'purchasable'} at that balance.
        ${cheapestOverall && mode==='buy' ? `The cheapest ship in-game is the <strong style="color:var(--cyan);">${cheapestOverall.name}</strong> at ${fmt(cheapestOverall.uecPrice)} aUEC — ${fmt(cheapestOverall.uecPrice - bal)} aUEC to go.` : ''}
      </div>` : `
      <div class="section-label">${affordable.length} within budget${candidates.length > 40 ? ' (top 40)' : ''}</div>
      ${affordable.map(e=>`
        <div class="eff-row" data-budget-id="${e.s.id}" style="cursor:pointer;">
          <div class="sim-thumb" style="width:36px;height:36px;flex-shrink:0;">${e.s.thumb?`<img src="${e.s.thumb}" alt="">`:(e.s.manufacturer||'').slice(0,2)}</div>
          <div style="flex:1; min-width:0;">
            <div class="eff-name">${e.s.name}</div>
            <div class="eff-sub">${e.s.manufacturer}${e.s.cargoSCU?` · ${fmt(e.s.cargoSCU)} SCU`:''}${e.s.seats?` · ${e.s.seats} seat${e.s.seats===1?'':'s'}`:''}</div>
          </div>
          <div style="text-align:right;">
            <div class="eff-metric">${fmt(e.cost)}<small>${mode==='rent'?'/day':''}</small></div>
            ${mode==='buy'?`<div class="eff-sub" style="color:#7ce89a;">${fmt(bal - e.cost)} left</div>`:''}
          </div>
        </div>`).join('')}
    `}

    <div class="tool-note">
      Based on in-game aUEC prices via UEX, which vary by terminal and can change between patches.
      Ships not sold in-game are excluded. Pledge-store cost isn't considered here.
    </div>
  `;

  const input = document.getElementById('budget-input');
  if(input) input.addEventListener('change', e=>{
    budgetState.balance = Math.max(0, Number(e.target.value) || 0);
    renderBudgetTool();
  });
  const modeWrap = document.getElementById('budget-mode');
  if(modeWrap) modeWrap.addEventListener('click', e=>{
    const btn = e.target.closest('.chip');
    if(!btn) return;
    budgetState.mode = btn.dataset.mode;
    renderBudgetTool();
  });
  document.querySelectorAll('[data-budget-id]').forEach(row=>row.addEventListener('click', ()=>{
    openDetail(row.dataset.budgetId);
  }));
}

/* ---- Trade routes: live top routes from UEX, matched against your hangar ----
   NOTE: the UEX /data_extract endpoint is documented as returning "plain text".
   Its exact shape is unverified, so parsing is deliberately defensive and
   failure is surfaced to the user rather than silently swallowed. */
const UEX_ROUTES_URL = 'https://uexcorp.space/api/2.0/data_extract?data=commodities_routes';
let routesCache = null;
let routesError = null;
let routesLoading = false;

function parseRoutesPayload(raw){
  // Try JSON first (either {data:[...]} or a bare array)
  let parsedJson = null;
  try{
    parsedJson = typeof raw === 'string' ? JSON.parse(raw) : raw;
  }catch(err){ /* not JSON - fall through to text */ }

  if(parsedJson !== null && typeof parsedJson === 'object'){
    const arr = Array.isArray(parsedJson) ? parsedJson
              : (Array.isArray(parsedJson.data) ? parsedJson.data : null);
    if(arr){
      // Valid JSON but no rows: report empty rather than dumping "[]" as text.
      return arr.length ? { kind:'json', rows:arr } : null;
    }
    if(typeof parsedJson.data === 'string' && parsedJson.data.trim()){
      return { kind:'text', text:parsedJson.data };
    }
    return null;
  }

  if(typeof raw === 'string' && raw.trim().length){
    return { kind:'text', text:raw };
  }
  return null;
}

async function loadRoutes(){
  if(routesLoading) return;
  routesLoading = true; routesError = null;
  renderRoutesTool();
  try{
    const res = await fetchWithTimeout(UEX_ROUTES_URL, FETCH_TIMEOUT_MS);
    if(!res.ok) throw new Error(`HTTP ${res.status}`);
    const raw = await res.text();
    const parsed = parseRoutesPayload(raw);
    if(!parsed) throw new Error('Empty or unrecognised response');
    routesCache = parsed;
  }catch(err){
    routesError = err.message;
  }
  routesLoading = false;
  renderRoutesTool();
}

/* Parse UEX's bullet-separated feed.
   Real observed shape (one single line, no newlines):
     "UEX • Best Commodities Routes • Updated Sep 4 • 2956 •
      WAST: Nyx Gateway (Stanton) ▶ Everus Harbor = Up to 55M UEC •
      ... • All values are estimated"
   Each route segment is:  CODE: Origin ▶ Destination = Up to <value> */
function parseUexRoutes(text){
  const segments = String(text).split(/\s*[•·]\s*/).map(x=>x.trim()).filter(Boolean);
  const routes = [];
  const meta = [];

  segments.forEach(seg=>{
    // A route must contain the ▶ arrow (or a fallback -> / →)
    const arrowMatch = seg.match(/^(?:([A-Za-z0-9]+)\s*:\s*)?(.+?)\s*(?:▶|→|->)\s*(.+?)\s*=\s*(.+)$/);
    if(arrowMatch){
      routes.push({
        code: arrowMatch[1] || null,
        origin: arrowMatch[2].trim(),
        destination: arrowMatch[3].trim(),
        value: arrowMatch[4].trim()
      });
    }else{
      meta.push(seg);
    }
  });

  // Pull a title/date out of the leading non-route segments if present
  const title = meta.find(m=>/updated/i.test(m)) || null;
  return { routes, meta, title };
}

/* Sort helper: turn "Up to 55M UEC" into a number for ranking. */
function routeValueNumber(v){
  const m = String(v).match(/([\d.]+)\s*([KMB])?/i);
  if(!m) return 0;
  let n = parseFloat(m[1]) || 0;
  const unit = (m[2]||'').toUpperCase();
  if(unit === 'K') n *= 1e3;
  else if(unit === 'M') n *= 1e6;
  else if(unit === 'B') n *= 1e9;
  return n;
}
