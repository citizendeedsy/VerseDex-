/* ---- Hangar import: paste a ship list from anywhere ---- */
function normaliseShipName(str){
  return String(str).toLowerCase()
    .replace(/[''`]/g, '')
    .replace(/[^a-z0-9]+/g, ' ')
    .trim();
}

/* Pull candidate ship names out of pasted text. Handles CSV, TSV, one-per-line,
   quantity prefixes ("2x Freelancer"), and common export column layouts. */
function extractShipNames(raw){
  const lines = String(raw).split(/\r?\n/).map(l=>l.trim()).filter(Boolean);
  const names = [];
  lines.forEach(line=>{
    // Split CSV/TSV rows; otherwise treat the whole line as one name
    let cells = line.includes('\t') ? line.split('\t')
              : (line.match(/,/g)||[]).length >= 1 ? line.split(',')
              : [line];
    cells = cells.map(c=>c.replace(/^["']|["']$/g,'').trim()).filter(Boolean);
    cells.forEach(c=>{
      // Strip leading quantities like "2x " or "3 x "
      const cleaned = c.replace(/^\d+\s*[x×]\s*/i, '').trim();
      if(cleaned && cleaned.length > 1 && !/^(name|ship|vehicle|qty|quantity|manufacturer)$/i.test(cleaned)){
        names.push(cleaned);
      }
    });
  });
  return names;
}

function matchShipsByName(names){
  const matched = [], unmatched = [];
  const index = SHIPS.map(s=>({ s, key: normaliseShipName(s.name) }));

  names.forEach(raw=>{
    const key = normaliseShipName(raw);
    if(!key) return;
    // exact, then startsWith, then contains - first match wins
    let hit = index.find(e=>e.key === key)
           || index.find(e=>e.key.startsWith(key) || key.startsWith(e.key))
           || index.find(e=>e.key.includes(key) || key.includes(e.key));
    if(hit && !matched.find(m=>m.id===hit.s.id)) matched.push(hit.s);
    else if(!hit) unmatched.push(raw);
  });
  return { matched, unmatched };
}

function wireImportSection(){
  const prev = document.getElementById('import-preview-btn');
  if(prev) prev.addEventListener('click', ()=>{
    const ta = document.getElementById('import-text');
    const text = ta ? ta.value : '';
    if(!text.trim()){
      setStatus('PASTE A SHIP LIST FIRST', 'error');
      setTimeout(()=>{ document.getElementById('status-banner').style.display='none'; }, 2200);
      return;
    }
    importPreview = matchShipsByName(extractShipNames(text));
    renderFleetTool();
  });

  const conf = document.getElementById('import-confirm-btn');
  if(conf) conf.addEventListener('click', ()=>{
    if(!importPreview) return;
    importPreview.matched.forEach(s=>hangarIds.add(s.id));
    saveHangar();
    updateHangarCount();
    const n = importPreview.matched.length;
    importPreview = null;
    renderList();
    renderFleetTool();
    setStatus(`ADDED ${n} SHIP${n===1?'':'S'} TO HANGAR`, 'ok');
    setTimeout(()=>{ document.getElementById('status-banner').style.display='none'; }, 2500);
  });

  const canc = document.getElementById('import-cancel-btn');
  if(canc) canc.addEventListener('click', ()=>{ importPreview = null; renderFleetTool(); });
}

function renderCompareRadar(){
  const wrap = document.getElementById('cmp-radar');
  const ships = [...compareIds].map(id => SHIPS.find(s=>s.id===id)).filter(Boolean);
  if(ships.length === 0){ wrap.innerHTML = ''; return; }

  const axes = [
    { label:'SCM',    get:s=>s.scmSpeed||0 },
    { label:'PITCH',  get:s=>s.pitch||0 },
    { label:'ROLL',   get:s=>s.roll||0 },
    { label:'ACCEL',  get:s=>s.accelMain||0 },
    { label:'HULL',   get:s=>s.health||0 },
    { label:'SHIELD', get:s=>s.shieldHP||0 },
    { label:'CARGO',  get:s=>s.cargoSCU||0 },
  ];
  const N = axes.length;
  const maxes = axes.map(ax => Math.max(1, ...ships.map(s=>ax.get(s))));
  const cx=150, cy=150, R=100;
  const colors = ['#4fd8e8','#f0a840','#e85a9a','#7ce89a'];

  function pt(i, frac){
    const angle = -Math.PI/2 + i*(2*Math.PI/N);
    return [cx + R*frac*Math.cos(angle), cy + R*frac*Math.sin(angle)];
  }

  let rings = '';
  [0.25,0.5,0.75,1].forEach(frac=>{
    const pts = axes.map((_,i)=>pt(i,frac).join(',')).join(' ');
    rings += `<polygon points="${pts}" fill="none" stroke="#22303c" stroke-width="1"/>`;
  });

  let axesLines = '', labels = '';
  axes.forEach((ax,i)=>{
    const [x,y] = pt(i,1);
    axesLines += `<line x1="${cx}" y1="${cy}" x2="${x}" y2="${y}" stroke="#22303c" stroke-width="1"/>`;
    const [lx,ly] = pt(i,1.16);
    labels += `<text x="${lx}" y="${ly}" fill="#728192" font-size="9" font-family="Share Tech Mono, monospace" text-anchor="middle" dominant-baseline="middle">${ax.label}</text>`;
  });

  let shapes = '';
  ships.forEach((s,si)=>{
    const color = colors[si % colors.length];
    const pts = axes.map((ax,i)=>{
      const frac = Math.max(0, Math.min(1, ax.get(s) / maxes[i]));
      return pt(i,frac).join(',');
    }).join(' ');
    shapes += `<polygon points="${pts}" fill="${color}" fill-opacity="0.15" stroke="${color}" stroke-width="2"/>`;
  });

  const legend = ships.map((s,si)=>`
    <div style="display:flex;align-items:center;gap:6px;font-family:'Share Tech Mono',monospace;font-size:10px;color:var(--muted);">
      <span style="width:10px;height:10px;background:${colors[si%colors.length]};display:inline-block;"></span>${s.name}
    </div>`).join('');

  wrap.innerHTML = `
    <svg viewBox="0 0 300 300" style="width:100%;max-width:320px;display:block;margin:0 auto;">
      ${rings}${axesLines}${shapes}${labels}
    </svg>
    <div style="display:flex;flex-wrap:wrap;gap:10px;justify-content:center;margin-top:10px;">${legend}</div>
  `;
}

/* ---------- URL routing (shareable links) ----------
   Uses the hash so it works on any static host with no server config:
     #ship=anvl-arrow   #tools=roi   #brand=Anvil%20Aerospace   #hangar */
let suppressHashWrite = false;

function setHash(h){
  if(suppressHashWrite) return;
  const target = h ? '#' + h : ' ';
  if(('#'+h) !== window.location.hash){
    try{ history.replaceState(null, '', target); }
    catch(err){ window.location.hash = h || ''; }
  }
}

function shipHashFor(s){
  return 'ship=' + encodeURIComponent(s.slug || s.id);
}

function findShipByHashKey(key){
  const k = decodeURIComponent(key).toLowerCase();
  return SHIPS.find(s => (s.slug||'').toLowerCase() === k)
      || SHIPS.find(s => String(s.id).toLowerCase() === k)
      || SHIPS.find(s => normaliseShipName(s.name) === normaliseShipName(k));
}

/* Apply whatever is in the URL. Called on load (after ships arrive) and on
   back/forward navigation. */
function applyHashRoute(){
  const raw = (window.location.hash || '').replace(/^#/, '');
  if(!raw) return false;

  const [key, value] = raw.split('=');
  suppressHashWrite = true;
  try{
    if(key === 'ship' && value){
      const ship = findShipByHashKey(value);
      if(ship){
        closeAllOverlays();
        openDetail(ship.id);
        setActiveNav('ships');
        return true;
      }
      setStatus('SHIP NOT FOUND FOR THIS LINK — SHOWING REGISTRY', 'error');
      setTimeout(()=>{ const el=document.getElementById('status-banner'); if(el) el.style.display='none'; }, 3500);
    }else if(key === 'tools'){
      closeAllOverlays();
      if(['efficiency','roi','budget','routes','fleet'].includes(value)) activeTool = value;
      openToolsView();
      setActiveNav('tools');
      return true;
    }else if(key === 'brand' && value){
      // Legacy links: apply as a manufacturer filter on the registry.
      const name = decodeURIComponent(value);
      closeAllOverlays();
      if(SHIPS.some(s=>s.manufacturer === name)){
        activeManufacturer = name;
        const sel = document.getElementById('mfg-filter');
        if(sel) sel.value = name;
        renderList();
      }
      setActiveNav('ships');
      return true;
    }else if(key === 'hangar'){
      closeAllOverlays();
      viewingHangar = true;
      const hb = document.getElementById('hangar-toggle');
      if(hb) hb.classList.add('active');
      renderList();
      setActiveNav('hangar');
      return true;
    }else if(key === 'ships'){
      closeAllOverlays();
      setActiveNav('ships');
      return true;
    }
  }finally{
    suppressHashWrite = false;
  }
  return false;
}

/* ---------- Animated tutorial ----------
   CSS-animated mock UI rather than screen recordings: no video assets to host,
   works offline, and stays accurate if the real UI changes colour/scale. */


function tutorialSeen(){
  try{ return localStorage.getItem(TUTORIAL_SEEN_KEY) === '1'; }catch(err){ return false; }
}
function markTutorialSeen(){
  try{ localStorage.setItem(TUTORIAL_SEEN_KEY, '1'); }catch(err){ /* storage blocked */ }
}

function openTutorial(fromStart){
  if(fromStart !== false) tutStep = 0;
  document.getElementById('tutorial').classList.add('open');
  document.body.style.overflow = 'hidden';
  renderTutorial();
}

function closeTutorial(){
  markTutorialSeen();
  document.getElementById('tutorial').classList.remove('open');
  syncBodyScroll();
}

function renderTutorial(){
  const step = TUT_STEPS[tutStep];
  if(!step) return;
  const stage = document.getElementById('tut-stage');
  // Re-assigning innerHTML restarts the CSS animations for this step.
  stage.innerHTML = step.stage;
  document.getElementById('tut-title').textContent = step.title;
  document.getElementById('tut-desc').textContent = step.desc;
  document.getElementById('tut-dots').innerHTML =
    TUT_STEPS.map((_,i)=>`<div class="tut-dot ${i===tutStep?'on':''}"></div>`).join('');
  const prev = document.getElementById('tut-prev');
  const next = document.getElementById('tut-next');
  prev.disabled = tutStep === 0;
  next.textContent = tutStep === TUT_STEPS.length - 1 ? 'GET STARTED' : 'NEXT';

  // Final step offers the install walkthrough directly.
  const existing = document.getElementById('tut-install');
  if(existing) existing.remove();
  if(step.showInstall && !isStandalone()){
    const btn = document.createElement('button');
    btn.id = 'tut-install';
    btn.className = 'cta primary';
    btn.textContent = '📲 SHOW ME HOW';
    btn.style.margin = '0 16px 10px';
    btn.style.width = 'calc(100% - 32px)';
    btn.addEventListener('click', ()=>{ closeTutorial(); showIosInstructions(); });
    const navRow = document.querySelector('.tut-nav');
    if(navRow && navRow.parentNode) navRow.parentNode.insertBefore(btn, navRow);
  }
}

/* ---------- Install to home screen ---------- */

function isStandalone(){
  return (window.matchMedia && window.matchMedia('(display-mode: standalone)').matches)
      || window.navigator.standalone === true;
}

function isIOS(){
  const ua = navigator.userAgent || '';
  // iPadOS 13+ reports as Mac, so also check for touch support.
  return /iPad|iPhone|iPod/.test(ua)
      || (/Macintosh/.test(ua) && typeof document !== 'undefined' && 'ontouchend' in document);
}

function installDismissed(){
  try{ return localStorage.getItem(INSTALL_DISMISSED_KEY) === '1'; }
  catch(err){ return false; }
}

function dismissInstall(){
  try{ localStorage.setItem(INSTALL_DISMISSED_KEY, '1'); }catch(err){ /* storage blocked */ }
  const card = document.getElementById('install-card');
  if(card) card.style.display = 'none';
}

/* Can we offer anything useful? Either a real prompt, or iOS instructions. */

  if(isStandalone()) return false;      // already installed
  return !!deferredInstallPrompt || isIOS();

function wireInstallCard(){
  const action = document.getElementById('install-action');
  if(action) action.addEventListener('click', async ()=>{
    if(deferredInstallPrompt){
      deferredInstallPrompt.prompt();
      try{
        const choice = await deferredInstallPrompt.userChoice;
        if(choice && choice.outcome === 'accepted') dismissInstall();
      }catch(err){ /* prompt already consumed */ }
      deferredInstallPrompt = null;
    }else{
      showIosInstructions();
    }
  });
  const dismiss = document.getElementById('install-dismiss');
  if(dismiss) dismiss.addEventListener('click', dismissInstall);
}

window.addEventListener('beforeinstallprompt', (e)=>{
  e.preventDefault();
  deferredInstallPrompt = e;
  // Re-render home so the button appears now that we can actually prompt.
  if(document.getElementById('home-view') &&
     document.getElementById('home-view').classList.contains('open')){
    renderHome();
  }
});

window.addEventListener('appinstalled', ()=>{
  deferredInstallPrompt = null;
  dismissInstall();
  setStatus('VERSEDEX INSTALLED — LAUNCH IT FROM YOUR HOME SCREEN', 'ok');
  setTimeout(()=>{ const el=document.getElementById('status-banner'); if(el) el.style.display='none'; }, 4000);
});

/* ---------- PWA: installable + offline shell ----------
   Manifest and service worker are generated at runtime as blobs so VERSEDEX
   stays a single deployable HTML file with no extra assets to upload. */
(function setupPWA(){
  const ICON = "data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 512 512'%3E%3Crect width='512' height='512' fill='%230a0e13'/%3E%3Cellipse cx='256' cy='256' rx='176' ry='64' fill='none' stroke='%234fd8e8' stroke-width='14'/%3E%3Cellipse cx='256' cy='256' rx='176' ry='64' fill='none' stroke='%234fd8e8' stroke-width='14' opacity='0.5' transform='rotate(-58 256 256)'/%3E%3Ccircle cx='256' cy='256' r='72' fill='%230a0e13' stroke='%234fd8e8' stroke-width='11'/%3E%3Ccircle cx='432' cy='256' r='18' fill='%23f0a840'/%3E%3C/svg%3E";

  try{
    const manifest = {
      name: 'VERSEDEX — Star Citizen Ship Registry',
      short_name: 'VERSEDEX',
      description: 'A fast mobile reference for every Star Citizen ship and vehicle.',
      start_url: './',
      scope: './',
      display: 'standalone',
      orientation: 'portrait',
      background_color: '#0a0e13',
      theme_color: '#0a0e13',
      icons: [
        { src: ICON, sizes: '192x192', type: 'image/svg+xml', purpose: 'any' },
        { src: ICON, sizes: '512x512', type: 'image/svg+xml', purpose: 'any' }
      ]
    };
    const blob = new Blob([JSON.stringify(manifest)], {type:'application/manifest+json'});
    const link = document.createElement('link');
    link.rel = 'manifest';
    link.href = URL.createObjectURL(blob);
    document.head.appendChild(link);
  }catch(err){
    console.warn('VERSEDEX: manifest unavailable', err && err.message);
  }

  // Service worker: cache the app shell so it opens without a connection.
  // Ship data still needs the network and fails gracefully without it.
  if('serviceWorker' in navigator && location.protocol === 'https:'){
    const swCode = `
      const CACHE = 'versedex-shell-v1';
      self.addEventListener('install', e=>{ self.skipWaiting(); });
      self.addEventListener('activate', e=>{
        e.waitUntil(caches.keys().then(keys=>Promise.all(
          keys.filter(k=>k!==CACHE).map(k=>caches.delete(k))
        )).then(()=>self.clients.claim()));
      });
      self.addEventListener('fetch', e=>{
        const req = e.request;
        if(req.method !== 'GET') return;
        const url = new URL(req.url);
        // Never cache API calls - ship and route data must stay current.
        if(url.hostname.includes('star-citizen.wiki') || url.hostname.includes('uexcorp')) return;
        if(url.origin !== location.origin) return;
        e.respondWith(
          fetch(req).then(res=>{
            const copy = res.clone();
            caches.open(CACHE).then(c=>c.put(req, copy)).catch(()=>{});
            return res;
          }).catch(()=> caches.match(req).then(hit=> hit || caches.match('./')))
        );
      });
    `;
    try{
      const swUrl = URL.createObjectURL(new Blob([swCode], {type:'text/javascript'}));
      navigator.serviceWorker.register(swUrl, {scope:'./'})
        .catch(err=>console.warn('VERSEDEX: service worker not registered —', err && err.message));
    }catch(err){
      console.warn('VERSEDEX: service worker unavailable', err && err.message);
    }
  }
})();
